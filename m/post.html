<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#fafafa;
}

/* HEADER */
.header{
height:55px;
background:white;
border-bottom:1px solid #ddd;
display:flex;
align-items:center;
justify-content:center;
font-weight:700;
}

/* CONTAINER */
.container{
padding:15px;
}

/* PREVIEW */
.preview{
width:100%;
height:300px;
background:#eee;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
overflow:hidden;
margin-bottom:15px;
}

.preview img{
width:100%;
height:100%;
object-fit:cover;
}

/* INPUT */
input[type="file"]{
margin-top:10px;
}

textarea{
width:100%;
height:80px;
margin-top:10px;
padding:10px;
border-radius:10px;
border:1px solid #ddd;
resize:none;
font-size:14px;
}

/* BUTTON */
button{
width:100%;
margin-top:15px;
padding:12px;
border:none;
border-radius:10px;
background:#1877f2;
color:white;
font-weight:600;
cursor:pointer;
}

button:active{
transform:scale(0.98);
}

/* TOAST */
#toast{
position:fixed;
bottom:30px;
left:50%;
transform:translateX(-50%);
background:#111;
color:white;
padding:12px 18px;
border-radius:10px;
font-size:14px;
opacity:0;
pointer-events:none;
transition:0.3s ease;
}

#toast.show{
opacity:1;
transform:translateX(-50%) translateY(-10px);
}

</style>


<div class="header">
Créer un post
</div>


<div class="container">

<div class="preview" id="preview">
<span>Aucune image</span>
</div>

<input type="file" id="file" accept="image/*">

<textarea id="caption" placeholder="Écris une description..."></textarea>

<button onclick="createPost()">Publier</button>

</div>


<!-- TOAST -->
<div id="toast"></div>


<script>

var currentUser = null;
var selectedFile = null;


async function init(){

currentUser = await Parse.User.currentAsync();

if(!currentUser){
location.replace("login.html");
return;
}

}


document.getElementById("file").addEventListener("change", function(e){

selectedFile = e.target.files[0];

if(!selectedFile) return;

var reader = new FileReader();

reader.onload = function(){

document.getElementById("preview").innerHTML =
'<img src="' + reader.result + '">';

};

reader.readAsDataURL(selectedFile);

});


function showToast(message){

var toast = document.getElementById("toast");

toast.innerText = message;

toast.classList.add("show");

setTimeout(function(){
toast.classList.remove("show");
}, 2000);

}


async function createPost(){

if(!selectedFile){
showToast("Choisis une image");
return;
}

var caption = document.getElementById("caption").value;

var parseFile = new Parse.File(selectedFile.name, selectedFile);

await parseFile.save();

var Post = Parse.Object.extend("Posts");
var post = new Post();

post.set("owner", currentUser);
post.set("image", parseFile);
post.set("caption", caption);
post.set("likes", 0);

await post.save();

showToast("Post publié");

setTimeout(function(){
location.href = "/home";
}, 1200);

}


init();

</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#fafafa;
}

/* HEADER */
.header{
height:55px;
background:white;
border-bottom:1px solid #ddd;
display:flex;
align-items:center;
justify-content:center;
font-weight:700;
}

/* CONTAINER */
.container{
padding:15px;
}

/* PREVIEW */
.preview{
width:100%;
height:300px;
background:#eee;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
overflow:hidden;
margin-bottom:15px;
}

.preview img{
width:100%;
height:100%;
object-fit:cover;
}

/* INPUT */
input[type="file"]{
margin-top:10px;
}

textarea{
width:100%;
height:80px;
margin-top:10px;
padding:10px;
border-radius:10px;
border:1px solid #ddd;
resize:none;
font-size:14px;
}

/* BUTTON */
button{
width:100%;
margin-top:15px;
padding:12px;
border:none;
border-radius:10px;
background:#1877f2;
color:white;
font-weight:600;
cursor:pointer;
}

button:active{
transform:scale(0.98);
}

/* TOAST */
#toast{
position:fixed;
bottom:30px;
left:50%;
transform:translateX(-50%);
background:#111;
color:white;
padding:12px 18px;
border-radius:10px;
font-size:14px;
opacity:0;
pointer-events:none;
transition:0.3s ease;
}

#toast.show{
opacity:1;
transform:translateX(-50%) translateY(-10px);
}

</style>


<div class="header">
Créer un post
</div>


<div class="container">

<div class="preview" id="preview">
<span>Aucune image</span>
</div>

<input type="file" id="file" accept="image/*">

<textarea id="caption" placeholder="Écris une description..."></textarea>

<button onclick="createPost()">Publier</button>

</div>


<div id="toast"></div>


<script>

var supabaseUrl = "https://zcckclyeqawcaclzmabj.supabase.co";
var supabaseKey = "sb_publishable_Vj1M_Jkv68n4EXuMmzjNow_RI05o_jh";

var supabase = supabase.createClient(supabaseUrl, supabaseKey);

var currentUser = null;
var selectedFile = null;


/* INIT */
async function init(){

    var { data: { session } } = await supabase.auth.getSession();

    if(!session){
        location.replace("login.html");
        return;
    }

    currentUser = session.user;
}

init();


/* PREVIEW */
document.getElementById("file").addEventListener("change", function(e){

    selectedFile = e.target.files[0];
    if(!selectedFile) return;

    var reader = new FileReader();

    reader.onload = function(){
        document.getElementById("preview").innerHTML =
        '<img src="' + reader.result + '">';
    };

    reader.readAsDataURL(selectedFile);
});


/* TOAST */
function showToast(message){

    var toast = document.getElementById("toast");

    toast.innerText = message;
    toast.classList.add("show");

    setTimeout(function(){
        toast.classList.remove("show");
    }, 2000);
}


/* CREATE POST */
async function createPost(){

    if(!selectedFile){
        showToast("Choisis une image");
        return;
    }

    var caption = document.getElementById("caption").value;


    /* UPLOAD IMAGE */
    var fileName = Date.now() + "_" + selectedFile.name;

    var { data: uploadData, error: uploadError } =
    await supabase.storage
    .from("posts")
    .upload(fileName, selectedFile);

    if(uploadError){
        showToast("Erreur upload");
        return;
    }


    /* PUBLIC URL */
    var { data: publicUrl } = supabase.storage
    .from("posts")
    .getPublicUrl(fileName);


    /* INSERT POST */
    var { error } = await supabase
    .from("posts")
    .insert([{
        owner: currentUser.id,
        image: publicUrl.publicUrl,
        caption: caption,
        likes: 0
    }]);

    if(error){
        showToast("Erreur post");
        return;
    }


    showToast("Post publié");

    setTimeout(function(){
        location.href = "/home.html";
    }, 1200);
}

</script>

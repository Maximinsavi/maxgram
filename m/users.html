<div id="list">Loading...</div>

<script>

async function load(){

var q = new Parse.Query(Parse.User);
q.limit(100);

var users = await q.find();

document.getElementById("list").innerHTML =
"TOTAL USERS: " + users.length;

for(var u of users){

document.getElementById("list").innerHTML +=
"<div>" + u.get("username") + "</div>";

}

}

load();

</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/parse/dist/parse.min.js"></script>

<script>
Parse.initialize(
"BHxYtdxdSPMSH5vXHVdKCVTBrxMBlbPLhz2p4CRc",
"88Fp770fFyWoBEXCljw9QhlaY6EPYcx9kR1sVpZV"
);

Parse.serverURL = "https://parseapi.back4app.com";
</script>


<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#fafafa;
}

.header{
height:55px;
background:white;
border-bottom:1px solid #ddd;
display:flex;
align-items:center;
justify-content:center;
font-weight:700;
}

.user{
background:white;
display:flex;
align-items:center;
padding:15px;
border-bottom:1px solid #eee;
}

.avatar{
width:55px;
height:55px;
border-radius:50%;
object-fit:cover;
margin-right:12px;
}

.info{
flex:1;
}

.name{
font-weight:700;
}

.bio{
font-size:13px;
color:#666;
}

button{
border:none;
background:#1877f2;
color:white;
padding:8px 14px;
border-radius:8px;
font-weight:600;
}

.following{
background:#eee;
color:#111;
}

.empty{
text-align:center;
margin-top:40px;
color:#777;
}

</style>


<div class="header">
Utilisateurs
</div>

<div id="list"></div>


<script>

var me = null;

async function start(){

me = await Parse.User.currentAsync();

if(!me){
location.replace("/login.html");
return;
}

loadUsers();

}


async function loadUsers(){

var q = new Parse.Query("Profiles");
q.limit(100);

var res = await q.find();

var list = document.getElementById("list");
list.innerHTML = "";

if(res.length === 0){
list.innerHTML = "<div class='empty'>Aucun utilisateur</div>";
return;
}

for(var p of res){

var user = p.get("user");

if(!user) continue;

if(user.id === me.id) continue;

var avatar = p.get("avatar");

var img = avatar
? avatar.url()
: "https://ui-avatars.com/api/?name=" + p.get("username");

var followed = await isFollowing(user);

var div = document.createElement("div");

div.className = "user";

div.innerHTML = `

<img class="avatar" src="${img}">

<div class="info">
<div class="name">${p.get("username")}</div>
<div class="bio">${p.get("bio") || ""}</div>
</div>

<button onclick="toggleFollow('${user.id}',this)"
class="${followed ? "following" : ""}">
${followed ? "Suivi" : "Suivre"}
</button>

`;

list.appendChild(div);

}

}


async function isFollowing(user){

var q = new Parse.Query("Follow");
q.equalTo("follower", me);
q.equalTo("following", user);

return await q.first() != null;

}


async function toggleFollow(id,btn){

var q = new Parse.Query(Parse.User);
var target = await q.get(id);

var check = new Parse.Query("Follow");
check.equalTo("follower", me);
check.equalTo("following", target);

var exist = await check.first();

if(exist){

await exist.destroy();
btn.innerHTML = "Suivre";
btn.classList.remove("following");

}else{

var Follow = Parse.Object.extend("Follow");
var f = new Follow();

f.set("follower", me);
f.set("following", target);

await f.save();

btn.innerHTML = "Suivi";
btn.classList.add("following");

}

}

start();

</script>

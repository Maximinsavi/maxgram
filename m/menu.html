<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;

/* HEADER */

.header{
display:flex;
align-items:center;
padding:15px;

border-bottom:1px solid #e6e6e6;
}

.avatar{

height:50px;
border-radius:50%;
object-fit:cover;
}

.user-info{
margin-left:12px;
}

.username{

}

/* MENU */

.menu{
padding:10px;
}

.item{
display:flex;
align-items:center;
justify-content:space-between;
background:white;
padding:15px;
margin-bottom:10px;
border-radius:12px;
border:1px solid #eee;
cursor:pointer;
}

.left{
display:flex;
align-items:center;
gap:12px;
}

.icon{
width:22px;
height:22px;
stroke:#111;
stroke-width:2;
fill:none;
}

.arrow{

height:18px;
stroke:#999;
stroke-width:2;

}

.item:active{

<div class="header">

<img id="avatar" class="avatar">

<div class="user-info">
<div class="username" id="username"></div>
<div style="font-size:12px;color:#777">Menu</div>
</div>

</div>


<div class="menu">

<div class="item" onclick="go('profile.html')">

</div>

<svg class="arrow" viewBox="0 0 24 24">
<path d="M9 18l6-6-6-6"/>
</svg>

</div>


<div class="item" onclick="go('users.html')">

<div class="left">

<svg class="icon" viewBox="0 0 24 24">
<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
<circle cx="9" cy="7" r="4"/>

</svg>

</div>


<div class="item" onclick="logout()">

<div class="left">

<svg class="icon" viewBox="0 0 24 24">
<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
<polyline points="16 17 21 12 16 7"/>
<line x1="21" y1="12" x2="9" y2="12"/>
</svg>

<div>Déconnexion</div>

</div>

<svg class="arrow" viewBox="0 0 24 24">
<path d="M9 18l6-6-6-6"/>
</svg>

</div>

</div>


<script>

var currentUser = null;

async function init(){

currentUser = await Parse.User.currentAsync();

if(!currentUser){
location.replace("login.html");
return;
}

await currentUser.fetch();
loadUser();

}

function loadUser(){

document.getElementById("username").innerText =
currentUser.get("username") || "";

var avatar = currentUser.get("avatar");

document.getElementById("avatar").src =
avatar
? avatar.url()
: "https://ui-avatars.com/api/?name=" + currentUser.get("username");

}

function go(page){
location.href = page;
}

async function logout(){
await Parse.User.logOut();
location.replace("login.html");
}

init();

</script>

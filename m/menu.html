<script>

var supabaseUrl = "https://zcckclyeqawcaclzmabj.supabase.co";
var supabaseKey = "sb_publishable_Vj1M_Jkv68n4EXuMmzjNow_RI05o_jh";

var supabase = supabase.createClient(supabaseUrl, supabaseKey);


/* START IMMÉDIAT */
init();


async function init(){

    var { data: { session } } = await supabase.auth.getSession();

    if(!session){
        location.href = "login.html";
        return;
    }

    var userId = session.user.id;

    var { data } = await supabase
    .from("profiles")
    .select("username, avatar")
    .eq("id", userId)
    .single();

    render(data);
}


/* RENDER DIRECT HTML */
function render(data){

    var name = (data && data.username) ? data.username : "User";

    var avatar = (data && data.avatar)
    ? data.avatar
    : "https://ui-avatars.com/api/?name=" + name;

    document.body.innerHTML = `
        <div style="
            display:flex;
            align-items:center;
            gap:12px;
            padding:15px;
            font-family:Arial;
        ">

            <img src="${avatar}" style="
                width:50px;
                height:50px;
                border-radius:50%;
                object-fit:cover;
            ">

            <div>
                <div style="font-weight:700;font-size:16px;">
                    ${name}
                </div>
                <div style="font-size:12px;color:#777;">
                    Menu
                </div>
            </div>

        </div>
    `;
}

</script>

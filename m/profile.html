<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/parse/dist/parse.min.js"></script>

<script>
Parse.initialize("APP_ID", "JS_KEY");
Parse.serverURL = "https://parseapi.back4app.com";
</script>

<div id="profile-page">

<style>

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
    background:#fafafa;
}

/* HEADER SIMPLE */
#profile-header{
    height:50px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:600;
}

/* PROFILE BOX */
#profile-box{
    background:white;
    padding:20px;
    text-align:center;
}

/* AVATAR */
#profile-avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    margin:auto;
    overflow:hidden;
    border:2px solid #eee;
}

#profile-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* USERNAME */
#username{
    margin-top:10px;
    font-size:18px;
    font-weight:600;
}

/* EMAIL */
#email{
    font-size:13px;
    color:#777;
}

/* ACTION BUTTONS */
#profile-actions{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:15px;
}

.btn{
    padding:8px 14px;
    border-radius:8px;
    font-size:13px;
    border:1px solid #ddd;
    background:white;
    cursor:pointer;
}

.btn-primary{
    background:#1877f2;
    color:white;
    border:none;
}

/* STATS */
#stats{
    display:flex;
    justify-content:space-around;
    margin-top:20px;
    border-top:1px solid #eee;
    padding-top:15px;
}

.stat{
    text-align:center;
}

.stat b{
    display:block;
}

</style>

<div id="profile-header">
Profil
</div>

<div id="profile-box">

    <div id="profile-avatar">
        <img id="avatar" src="">
    </div>

    <div id="username">Loading...</div>
    <div id="email"></div>

    <div id="profile-actions">
        <button class="btn btn-primary" onclick="location.href='/m/edit-profile.html'">
            Modifier
        </button>

        <button class="btn" onclick="logout()">
            Déconnexion
        </button>
    </div>

    <div id="stats">
        <div class="stat">
            <b>0</b>
            Posts
        </div>

        <div class="stat">
            <b>0</b>
            Abonnés
        </div>

        <div class="stat">
            <b>0</b>
            Abonnements
        </div>
    </div>

</div>

</div>

<script>
function logout(){
    Parse.User.logOut().then(() => {
        location.href = "/login.html";
    });
}

document.addEventListener("DOMContentLoaded", function(){

    var user = Parse.User.current();

    if(!user){
        location.href = "/login.html";
        return;
    }

    var avatar = document.getElementById("avatar");
    var username = document.getElementById("username");
    var email = document.getElementById("email");

    var defaultAvatar =
    "https://ui-avatars.com/api/?name=User&background=ccc&color=fff&size=200";

    username.innerText = user.get("username") || "User";
    email.innerText = user.get("email") || "";

    var file = user.get("avatar");

    if(file){
        avatar.src = file.url();
    } else {
        avatar.src = defaultAvatar;
    }

});
</script>

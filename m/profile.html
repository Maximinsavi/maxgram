<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<div id="toast"></div>

<div id="app">

<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:white;
}

/* HEADER INSTAGRAM STYLE */
#header{
height:50px;
display:flex;
align-items:center;
justify-content:center;
border-bottom:1px solid #eee;
font-weight:600;
}

/* PROFILE TOP */
.top{
display:flex;
padding:15px;
gap:15px;
align-items:center;
}

/* AVATAR */
#avatarBox{
width:85px;
height:85px;
border-radius:50%;
overflow:hidden;
border:1px solid #ddd;
}

#avatar{
width:100%;
height:100%;
object-fit:cover;
}

/* STATS */
.stats{
flex:1;
display:flex;
justify-content:space-around;
text-align:center;
}

.stats b{
display:block;
font-size:16px;
}

/* INPUTS */
input,textarea{
width:100%;
margin-top:10px;
padding:10px;
border-radius:10px;
border:1px solid #ddd;
font-size:14px;
outline:none;
}

textarea{
height:60px;
resize:none;
}

/* BUTTON */
button{
width:calc(100% - 30px);
margin:15px;
padding:12px;
border:none;
border-radius:10px;
background:#1877f2;
color:white;
font-weight:600;
}

/* GRID POSTS */
#grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:2px;
margin-top:10px;
}

.post{
height:120px;
background:#eee;
}

.post img{
width:100%;
height:100%;
object-fit:cover;
}

/* TOAST */
#toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#111;
color:white;
padding:10px 15px;
border-radius:8px;
opacity:0;
transition:0.3s;
}

#toast.show{
opacity:1;
transform:translateX(-50%) translateY(-6px);
}

</style>


<div id="header">Profil</div>

<div class="top">

<div id="avatarBox" onclick="document.getElementById('file').click()">
<img id="avatar">
</div>

<div class="stats">
<div><b id="postsCount">0</b>Posts</div>
<div><b id="followers">0</b>Followers</div>
<div><b id="following">0</b>Following</div>
</div>

</div>

<input id="username" placeholder="Nom utilisateur">
<textarea id="bio" placeholder="Bio"></textarea>

<button onclick="saveProfile()">Enregistrer</button>

<div id="grid"></div>

<input type="file" id="file" style="display:none">

</div>


<script>

var supabaseUrl = "https://zcckclyeqawcaclzmabj.supabase.co";
var supabaseKey = "sb_publishable_Vj1M_Jkv68n4EXuMmzjNow_RI05o_jh";

var supabase = supabase.createClient(supabaseUrl, supabaseKey);

var user = null;

init();

async function init(){

    const { data: { session } } = await supabase.auth.getSession();

    if(!session){
        location.href = "/login.html";
        return;
    }

    user = session.user;

    await loadProfile();
    await loadPosts();
}

async function loadProfile(){

    const { data } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .maybeSingle();

    const name = data?.username || user.email;

    document.getElementById("username").value = data?.username || "";
    document.getElementById("bio").value = data?.bio || "";

    document.getElementById("postsCount").innerText = data?.posts_count || 0;
    document.getElementById("followers").innerText = data?.followers || 0;
    document.getElementById("following").innerText = data?.following || 0;

    document.getElementById("avatar").src =
        data?.avatar || "https://ui-avatars.com/api/?name=" + name;
}

async function saveProfile(){

    const { error } = await supabase
    .from("profiles")
    .upsert({
        id: user.id,
        username: document.getElementById("username").value,
        bio: document.getElementById("bio").value
    });

    toast(error ? "Erreur" : "Profil sauvegardé");
}

document.getElementById("file").addEventListener("change", async function(e){

    const file = e.target.files[0];
    if(!file) return;

    const fileName = user.id + "-" + Date.now();

    const { error } = await supabase.storage
    .from("avatars")
    .upload(fileName, file);

    if(error){
        toast("Upload erreur");
        return;
    }

    const { data } = supabase.storage
    .from("avatars")
    .getPublicUrl(fileName);

    await supabase
    .from("profiles")
    .upsert({
        id: user.id,
        avatar: data.publicUrl
    });

    document.getElementById("avatar").src = data.publicUrl;

    toast("Photo mise à jour");
});

async function loadPosts(){

    const { data } = await supabase
    .from("posts")
    .select("*")
    .eq("owner", user.id)
    .order("created_at", { ascending:false });

    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    (data || []).forEach(p => {

        const div = document.createElement("div");
        div.className = "post";
        div.innerHTML = `<img src="${p.image}">`;
        grid.appendChild(div);

    });
}

function toast(msg){

    const t = document.getElementById("toast");

    t.innerText = msg;
    t.classList.add("show");

    setTimeout(()=> t.classList.remove("show"), 2000);
}

</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<div id="toast"></div>

<div id="profile-page">

<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#f6f7f9;
}

/* HEADER */
#header{
height:55px;
display:flex;
align-items:center;
justify-content:center;
background:white;
border-bottom:1px solid #ddd;
font-weight:700;
}

/* CARD */
.card{
background:white;
margin:12px;
padding:15px;
border-radius:12px;
}

/* AVATAR */
#avatarBox{
width:90px;
height:90px;
border-radius:50%;
overflow:hidden;
border:2px solid #eee;
cursor:pointer;
transition:0.2s;
}

#avatarBox:active{
transform:scale(0.95);
}

#avatar{
width:100%;
height:100%;
object-fit:cover;
}

/* INPUTS */
input,textarea{
width:100%;
margin-top:10px;
padding:10px;
border-radius:10px;
border:1px solid #ddd;
outline:none;
font-size:14px;
}

textarea{
resize:none;
height:70px;
}

/* BUTTON */
button{
width:100%;
margin-top:12px;
padding:12px;
border:none;
border-radius:10px;
background:#1877f2;
color:white;
font-weight:600;
cursor:pointer;
transition:0.2s;
}

button:active{
transform:scale(0.98);
}

/* STATS */
.stats{
display:flex;
justify-content:space-around;
text-align:center;
margin-top:10px;
}

.stats b{
display:block;
font-size:18px;
}

/* TOAST */
#toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#111;
color:white;
padding:12px 16px;
border-radius:10px;
font-size:14px;
opacity:0;
transition:0.3s;
pointer-events:none;
}

#toast.show{
opacity:1;
transform:translateX(-50%) translateY(-8px);
}

</style>


<div id="header">Profil</div>


<div class="card">

<div style="display:flex;gap:15px;align-items:center;">

<div id="avatarBox" onclick="document.getElementById('file').click()">
<img id="avatar">
</div>

<div style="flex:1">
<input id="username" placeholder="Nom utilisateur">
<textarea id="bio" placeholder="Bio"></textarea>
</div>

</div>


<div class="stats">
<div><b id="postsCount">0</b>Posts</div>
<div><b id="followers">0</b>Followers</div>
<div><b id="following">0</b>Following</div>
</div>

<button onclick="saveProfile()">Enregistrer</button>

</div>

<input type="file" id="file" accept="image/*" style="display:none">

</div>


<script>

var supabaseUrl = "https://zcckclyeqawcaclzmabj.supabase.co";
var supabaseKey = "sb_publishable_Vj1M_Jkv68n4EXuMmzjNow_RI05o_jh";

var supabase = supabase.createClient(supabaseUrl, supabaseKey);

var currentUser = null;


/* START */
init();


async function init(){

    const { data: { session } } = await supabase.auth.getSession();

    if(!session || !session.user){
        location.href = "/login.html";
        return;
    }

    currentUser = session.user;

    await loadProfile();
}


/* LOAD PROFILE */
async function loadProfile(){

    const { data } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .maybeSingle();

    const username =
        data?.username ||
        currentUser.email ||
        "User";

    document.getElementById("username").value = data?.username || "";
    document.getElementById("bio").value = data?.bio || "";

    document.getElementById("postsCount").innerText = data?.posts_count || 0;
    document.getElementById("followers").innerText = data?.followers || 0;
    document.getElementById("following").innerText = data?.following || 0;

    document.getElementById("avatar").src =
        data?.avatar ||
        "https://ui-avatars.com/api/?name=" + username;
}


/* SAVE PROFILE */
async function saveProfile(){

    const { error } = await supabase
    .from("profiles")
    .update({
        username: document.getElementById("username").value,
        bio: document.getElementById("bio").value
    })
    .eq("id", currentUser.id);

    if(error){
        toast("Erreur sauvegarde ❌");
    } else {
        toast("Profil mis à jour ✅");
    }
}


/* AVATAR CHANGE (FLUID + AUTO SAVE) */
document.getElementById("file").addEventListener("change", async function(e){

    const file = e.target.files[0];
    if(!file) return;

    const fileName = Date.now() + "_" + file.name;

    const { error } = await supabase.storage
    .from("avatars")
    .upload(fileName, file);

    if(error){
        toast("Upload échoué ❌");
        return;
    }

    const { data } = supabase.storage
    .from("avatars")
    .getPublicUrl(fileName);

    const url = data.publicUrl;

    await supabase
    .from("profiles")
    .update({ avatar: url })
    .eq("id", currentUser.id);

    document.getElementById("avatar").src = url;

    toast("Photo mise à jour ✅");
});


/* TOAST SYSTEM */
function toast(msg){

    var t = document.getElementById("toast");

    t.innerText = msg;
    t.classList.add("show");

    setTimeout(function(){
        t.classList.remove("show");
    }, 2000);
}

</script>

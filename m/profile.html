<script>



var currentUser=null;





async function start(){


currentUser =
await Parse.User.currentAsync();



if(!currentUser){

location.replace("/login.html");

return;

}



await currentUser.fetch();



loadUser();


loadPosts();


}







function loadUser(){



document
.getElementById("username")
.value =
currentUser.get("username") || "";



document
.getElementById("bio")
.value =
currentUser.get("bio") || "";




document
.getElementById("postsCount")
.innerHTML =
currentUser.get("postsCount") || 0;




document
.getElementById("followers")
.innerHTML =
currentUser.get("followers") || 0;




document
.getElementById("following")
.innerHTML =
currentUser.get("following") || 0;





var avatar =
currentUser.get("avatar");



if(avatar){

document.getElementById("avatar").src =
avatar.url();

}

else{


document.getElementById("avatar").src =
"https://ui-avatars.com/api/?name="
+
currentUser.get("username");


}


}







document
.getElementById("file")
.addEventListener(
"change",
async function(e){



var file =
e.target.files[0];


if(!file)return;




var parseFile =
new Parse.File(
file.name,
file
);



await parseFile.save();




currentUser.set(
"avatar",
parseFile
);



await currentUser.save();




document
.getElementById("avatar")
.src =
parseFile.url();



});










async function saveProfile(){



currentUser.set(
"username",
document.getElementById("username").value
);



currentUser.set(
"bio",
document.getElementById("bio").value
);



await currentUser.save();



alert("Profil enregistré");



}









async function loadPosts(){



var query =
new Parse.Query("Posts");



query.equalTo(
"owner",
currentUser
);



query.descending(
"createdAt"
);



var posts =
await query.find();



var grid =
document.getElementById("grid");



grid.innerHTML="";





posts.forEach(function(post){



var image =
post.get("image");



if(!image)return;



var div =
document.createElement("div");


div.className="post";



div.innerHTML =
`
<img src="${image.url()}">
`;



grid.appendChild(div);



});



}






start();



</script>

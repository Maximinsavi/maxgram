<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

var supabaseUrl = "https://zcckclyeqawcaclzmabj.supabase.co";
var supabaseKey = "sb_publishable_Vj1M_Jkv68n4EXuMmzjNow_RI05o_jh";

var supabase = supabase.createClient(supabaseUrl, supabaseKey);

var currentUser = null;


async function start(){

    var { data: { session } } = await supabase.auth.getSession();

    if(!session){
        location.replace("/login.html");
        return;
    }

    currentUser = session.user;

    await loadUser();
    await loadPosts();
}


/* ---------------- USER ---------------- */

async function loadUser(){

    var { data, error } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .single();

    if(error) return;

    document.getElementById("username").value = data.username || "";
    document.getElementById("bio").value = data.bio || "";

    document.getElementById("postsCount").innerHTML = data.posts_count || 0;
    document.getElementById("followers").innerHTML = data.followers || 0;
    document.getElementById("following").innerHTML = data.following || 0;

    if(data.avatar){
        document.getElementById("avatar").src = data.avatar;
    } else {
        document.getElementById("avatar").src =
        "https://ui-avatars.com/api/?name=" + (data.username || "User");
    }
}


/* ---------------- UPLOAD AVATAR ---------------- */

document.getElementById("file")
.addEventListener("change", async function(e){

    var file = e.target.files[0];
    if(!file) return;

    var fileName = Date.now() + "_" + file.name;

    var { data, error } = await supabase.storage
    .from("avatars")
    .upload(fileName, file);

    if(error) return;

    var { data: publicUrl } = supabase.storage
    .from("avatars")
    .getPublicUrl(fileName);

    await supabase
    .from("profiles")
    .update({ avatar: publicUrl.publicUrl })
    .eq("id", currentUser.id);

    document.getElementById("avatar").src = publicUrl.publicUrl;
});


/* ---------------- SAVE PROFILE ---------------- */

async function saveProfile(){

    await supabase
    .from("profiles")
    .update({
        username: document.getElementById("username").value,
        bio: document.getElementById("bio").value
    })
    .eq("id", currentUser.id);

    alert("Profil enregistré");
}


/* ---------------- POSTS ---------------- */

async function loadPosts(){

    var { data: posts, error } = await supabase
    .from("posts")
    .select("*")
    .eq("owner", currentUser.id)
    .order("created_at", { ascending: false });

    if(error) return;

    var grid = document.getElementById("grid");
    grid.innerHTML = "";

    posts.forEach(function(post){

        if(!post.image) return;

        var div = document.createElement("div");
        div.className = "post";

        div.innerHTML = `<img src="${post.image}">`;

        grid.appendChild(div);
    });
}


/* START */
start();

</script>

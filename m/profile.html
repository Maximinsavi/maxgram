<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<div id="toast"></div>


<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#f6f7f9;
}

#header{
height:55px;
display:flex;
align-items:center;
justify-content:center;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}


.card{
background:white;
margin:12px;
padding:15px;
border-radius:12px;
}


#avatarBox{
width:90px;
height:90px;
border-radius:50%;
overflow:hidden;
border:2px solid #eee;
cursor:pointer;
position:relative;
}


#avatar{
width:100%;
height:100%;
object-fit:cover;
}


#camera{
position:absolute;
bottom:0;
right:0;
background:#1877f2;
color:white;
padding:5px;
border-radius:50%;
}


input,textarea{
width:100%;
margin-top:10px;
padding:10px;
border-radius:10px;
border:1px solid #ddd;
box-sizing:border-box;
}


textarea{
height:60px;
resize:none;
}


button{
width:100%;
margin-top:12px;
padding:12px;
border:none;
border-radius:10px;
background:#1877f2;
color:white;
}


.stats{
display:flex;
justify-content:space-around;
margin-top:15px;
text-align:center;
}


.stats b{
display:block;
font-size:18px;
}


#toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#111;
color:white;
padding:10px 15px;
border-radius:10px;
opacity:0;
transition:.2s;
}


#toast.show{
opacity:1;
}

</style>



<div id="header">
Profil
</div>



<div class="card">


<div style="display:flex;gap:15px;align-items:center;">


<div id="avatarBox"
onclick="document.getElementById('file').click()">

<img id="avatar">

<div id="camera">
📷
</div>

</div>



<div style="flex:1">

<input id="username" placeholder="Nom utilisateur">

<textarea id="bio" placeholder="Bio"></textarea>

</div>


</div>




<div class="stats">

<div>
<b id="postsCount">0</b>
Posts
</div>


<div>
<b id="followers">0</b>
Followers
</div>


<div>
<b id="following">0</b>
Following
</div>


</div>



<button onclick="saveProfile()">
Enregistrer
</button>


</div>



<input type="file"
id="file"
accept="image/*"
style="display:none">





<script>


var supabaseUrl =
"https://zcckclyeqawcaclzmabj.supabase.co";


var supabaseKey =
"sb_publishable_Vj1M_Jkv68n4EXuMmzjNow_RI05o_jh";


var supabase =
supabase.createClient(
supabaseUrl,
supabaseKey
);



var user=null;
var selectedFile=null;



init();



async function init(){


var result =
await supabase.auth.getSession();



var session =
result.data.session;



if(!session){

location.href="/login.html";

return;

}



user=session.user;


loadProfile();


}







async function loadProfile(){



var result =
await supabase
.from("profiles")
.select("*")
.eq("id",user.id)
.maybeSingle();



var data=result.data;



if(data){


username.value =
data.username || "";


bio.value =
data.bio || "";


postsCount.innerText =
data.posts_count || 0;


followers.innerText =
data.followers_count || 0;


following.innerText =
data.following_count || 0;



avatar.src =
data.avatar ||
"https://ui-avatars.com/api/?name=User";



}

else{


avatar.src =
"https://ui-avatars.com/api/?name=User";


}



}






file.addEventListener(
"change",
function(e){


selectedFile=e.target.files[0];


if(!selectedFile)return;



var reader=new FileReader();


reader.onload=function(){

avatar.src=reader.result;

};



reader.readAsDataURL(selectedFile);



});









async function saveProfile(){


var avatarUrl=null;



if(selectedFile){



var name =
user.id+"_"+Date.now();



var upload =
await supabase.storage
.from("avatars")
.upload(
name,
selectedFile,
{
upsert:true
}
);



if(upload.error){

toast(upload.error.message);

return;

}



var url =
supabase.storage
.from("avatars")
.getPublicUrl(name);



avatarUrl =
url.data.publicUrl;


}






var save =
await supabase
.from("profile")
.upsert({


id:user.id,

username:
username.value,

full_name:"",

bio:
bio.value,


avatar:
avatarUrl,


posts_count:0,

followers_count:0,

following_count:0,


is_private:false,

is_verified:false,

is_active:true


});





if(save.error){

toast(save.error.message);

return;

}



toast("Profil sauvegardé");


}








function toast(text){


var t =
document.getElementById("toast");


t.innerText=text;


t.classList.add("show");



setTimeout(function(){

t.classList.remove("show");

},2000);


}


</script>

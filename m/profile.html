<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<div id="profile-page">

<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:white;
}

#header{
height:50px;
display:flex;
align-items:center;
border-bottom:1px solid #ddd;
padding:0 15px;
}

#back{
font-size:25px;
cursor:pointer;
}

#title{
flex:1;
text-align:center;
font-weight:700;
}

#profile{
padding:20px;
}

.top{
display:flex;
align-items:center;
}

#avatarBox{
width:95px;
height:95px;
border-radius:50%;
overflow:hidden;
border:1px solid #ddd;
}

#avatar{
width:100%;
height:100%;
object-fit:cover;
}

.stats{
flex:1;
display:flex;
justify-content:space-around;
text-align:center;
}

.stats b{
display:block;
font-size:20px;
}

#username{
font-size:20px;
font-weight:bold;
border:none;
outline:none;
margin-top:20px;
width:100%;
}

#bio{
width:100%;
height:60px;
border:none;
resize:none;
outline:none;
}

button{
flex:1;
padding:10px;
border-radius:8px;
border:1px solid #ddd;
background:white;
font-weight:bold;
}

.primary{
background:#1877f2;
color:white;
}

#grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:3px;
margin-top:20px;
}

.post{
height:120px;
background:#eee;
}

.post img{
width:100%;
height:100%;
object-fit:cover;
}

</style>


<div id="header">
<div id="back" onclick="history.back()">‹</div>
<div id="title">Profil</div>
</div>


<div id="profile">

<div class="top">

<div id="avatarBox" onclick="document.getElementById('file').click()">
<img id="avatar">
</div>

<div class="stats">
<div><b id="postsCount">0</b> Posts</div>
<div><b id="followers">0</b> Followers</div>
<div><b id="following">0</b> Following</div>
</div>

</div>

<input type="file" id="file" style="display:none">

<input id="username" placeholder="Nom utilisateur">
<textarea id="bio" placeholder="Bio"></textarea>

<button class="primary" onclick="saveProfile()">Modifier</button>

<div id="grid"></div>

</div>
</div>


<script>

var supabaseUrl = "https://zcckclyeqawcaclzmabj.supabase.co";
var supabaseKey = "sb_publishable_Vj1M_Jkv68n4EXuMmzjNow_RI05o_jh";

var supabase = supabase.createClient(supabaseUrl, supabaseKey);

var currentUser = null;


/* START REAL SESSION CHECK */
start();

async function start(){

    const { data: { session } } = await supabase.auth.getSession();

    console.log("SESSION:", session);

    if(!session || !session.user){
        location.replace("/login.html");
        return;
    }

    currentUser = session.user;

    await loadUser();
    await loadPosts();
}


/* LOAD USER (REAL SUPABASE) */
async function loadUser(){

    const { data, error } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .maybeSingle();

    console.log("PROFILE:", data, error);

    const username = data?.username || currentUser.email || "User";
    const avatar = data?.avatar;

    document.getElementById("username").value = data?.username || "";
    document.getElementById("bio").value = data?.bio || "";

    document.getElementById("avatar").src =
        avatar || "https://ui-avatars.com/api/?name=" + username;

    document.getElementById("postsCount").innerText = data?.posts_count || 0;
    document.getElementById("followers").innerText = data?.followers || 0;
    document.getElementById("following").innerText = data?.following || 0;
}


/* SAVE PROFILE */
async function saveProfile(){

    await supabase
    .from("profiles")
    .update({
        username: document.getElementById("username").value,
        bio: document.getElementById("bio").value
    })
    .eq("id", currentUser.id);

    alert("Profil enregistré");
}


/* LOAD POSTS */
async function loadPosts(){

    const { data } = await supabase
    .from("posts")
    .select("*")
    .eq("owner", currentUser.id)
    .order("created_at", { ascending: false });

    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    (data || []).forEach(post => {

        const div = document.createElement("div");
        div.className = "post";

        div.innerHTML = `<img src="${post.image}">`;

        grid.appendChild(div);
    });
}


/* FILE UPLOAD AVATAR */
document.getElementById("file").addEventListener("change", async function(e){

    const file = e.target.files[0];
    if(!file) return;

    const fileName = Date.now() + "_" + file.name;

    const { error } = await supabase.storage
    .from("avatars")
    .upload(fileName, file);

    if(error){
        alert("Upload error");
        return;
    }

    const { data } = supabase.storage
    .from("avatars")
    .getPublicUrl(fileName);

    await supabase
    .from("profiles")
    .update({ avatar: data.publicUrl })
    .eq("id", currentUser.id);

    document.getElementById("avatar").src = data.publicUrl;
});

</script>

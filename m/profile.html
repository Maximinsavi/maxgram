<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<div id="toast"></div>

<div id="app">

<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#f6f7f9;
}

/* HEADER */
#header{
height:55px;
display:flex;
align-items:center;
justify-content:center;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

/* PROFILE */
.card{
background:white;
margin:12px;
padding:15px;
border-radius:12px;
}

/* AVATAR */
#avatarBox{
width:95px;
height:95px;
border-radius:50%;
overflow:hidden;
border:2px solid #eee;
cursor:pointer;
position:relative;
}

#avatar{
width:100%;
height:100%;
object-fit:cover;
}

/* CAMERA ICON OVERLAY */
#camera{
position:absolute;
bottom:0;
right:0;
background:#1877f2;
color:white;
font-size:12px;
padding:5px 7px;
border-radius:50%;
}

/* INPUTS */
input,textarea{
width:100%;
margin-top:10px;
padding:10px;
border-radius:10px;
border:1px solid #ddd;
font-size:14px;
outline:none;
}

textarea{
height:60px;
resize:none;
}

/* BUTTON */
button{
width:100%;
margin-top:12px;
padding:12px;
border:none;
border-radius:10px;
background:#1877f2;
color:white;
font-weight:600;
cursor:pointer;
}

/* STATS */
.stats{
display:flex;
justify-content:space-around;
text-align:center;
margin-top:10px;
}

.stats b{
display:block;
font-size:18px;
}

/* TOAST */
#toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#111;
color:white;
padding:10px 15px;
border-radius:8px;
opacity:0;
transition:0.3s;
}

#toast.show{
opacity:1;
transform:translateX(-50%) translateY(-6px);
}

</style>


<div id="header">Profil</div>

<div class="card">

<div style="display:flex;gap:15px;align-items:center;">

<div id="avatarBox" onclick="document.getElementById('file').click()">
<img id="avatar">
<div id="camera">📷</div>
</div>

<div style="flex:1">
<input id="username" placeholder="Nom utilisateur">
<textarea id="bio" placeholder="Bio"></textarea>
</div>

</div>

<div class="stats">
<div><b id="postsCount">0</b>Posts</div>
<div><b id="followers">0</b>Followers</div>
<div><b id="following">0</b>Following</div>
</div>

<button onclick="saveProfile()">Enregistrer</button>

</div>

<input type="file" id="file" accept="image/*" style="display:none">

</div>


<script>

var supabaseUrl = "https://zcckclyeqawcaclzmabj.supabase.co";
var supabaseKey = "sb_publishable_Vj1M_Jkv68n4EXuMmzjNow_RI05o_jh";

var supabase = supabase.createClient(supabaseUrl, supabaseKey);

var user = null;
var localPreview = null;

init();

async function init(){

    const { data: { session } } = await supabase.auth.getSession();

    if(!session){
        location.href = "/login.html";
        return;
    }

    user = session.user;

    await loadProfile();
}


/* LOAD */
async function loadProfile(){

    const { data } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .maybeSingle();

    const name = data?.username || user.email;

    document.getElementById("username").value = data?.username || "";
    document.getElementById("bio").value = data?.bio || "";

    document.getElementById("postsCount").innerText = data?.posts_count || 0;
    document.getElementById("followers").innerText = data?.followers || 0;
    document.getElementById("following").innerText = data?.following || 0;

    document.getElementById("avatar").src =
        data?.avatar || "https://ui-avatars.com/api/?name=" + name;
}


/* PHOTO CHANGE (NEW METHOD) */
document.getElementById("file").addEventListener("change", function(e){

    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(){

        // PREVIEW INSTANT (NO ERROR HERE)
        document.getElementById("avatar").src = reader.result;

        localPreview = file;
    };

    reader.readAsDataURL(file);
});


/* SAVE */
async function saveProfile(){

    try {

        let avatarUrl = null;

        // upload only if new image selected
        if(localPreview){

            const fileName = user.id + "_" + Date.now();

            const { error: uploadError } = await supabase.storage
            .from("avatars")
            .upload(fileName, localPreview);

            if(uploadError){
                toast("Upload bloqué");
                return;
            }

            const { data } = supabase.storage
            .from("avatars")
            .getPublicUrl(fileName);

            avatarUrl = data.publicUrl;
        }

        const { error } = await supabase
        .from("profiles")
        .upsert({
            id: user.id,
            username: document.getElementById("username").value,
            bio: document.getElementById("bio").value,
            ...(avatarUrl ? { avatar: avatarUrl } : {})
        });

        if(error){
            toast("Erreur sauvegarde");
            return;
        }

        toast("Profil mis à jour");

        localPreview = null;

    } catch (e) {
        toast("Erreur système");
    }
}


/* TOAST */
function toast(msg){

    const t = document.getElementById("toast");

    t.innerText = msg;
    t.classList.add("show");

    setTimeout(()=> t.classList.remove("show"), 2000);
}

</script>

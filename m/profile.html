<div class="top">

<div>
<b id="postsCount">0</b>
Posts

<input type="file" id="file" accept="image/*" style="display:none">

<input id="username" placeholder="Nom utilisateur">

<textarea id="bio" placeholder="Bio"></textarea>

<div class="buttons">
<button class="primary" onclick="saveProfile()">Modifier</button>
<button>Partager</button>
</div>

<div id="grid"></div>

</div>

</div>


<script>

var currentUser = null;


/* START */
start();


async function start(){

    try {

        currentUser = await Parse.User.currentAsync();

        if(!currentUser){
            location.replace("/login.html");
            return;
        }

        await currentUser.fetch();

        loadUser();
        loadPosts();

    } catch (e) {
        console.log("START ERROR:", e);
    }
}


/* LOAD USER */
function loadUser(){

    document.getElementById("username").value =
    currentUser.get("username") || "";

    document.getElementById("bio").value =
    currentUser.get("bio") || "";

    document.getElementById("postsCount").innerText =
    currentUser.get("postsCount") || 0;

    document.getElementById("followers").innerText =
    currentUser.get("followers") || 0;

    document.getElementById("following").innerText =
    currentUser.get("following") || 0;

    var avatar = currentUser.get("avatar");

    if(avatar && avatar.url){
        document.getElementById("avatar").src = avatar.url();
    } else {
        document.getElementById("avatar").src =
        "https://ui-avatars.com/api/?name=" + (currentUser.get("username") || "User");
    }
}


/* SAVE PROFILE */
async function saveProfile(){

    try {

        currentUser.set(
            "username",
            document.getElementById("username").value
        );

        currentUser.set(
            "bio",
            document.getElementById("bio").value
        );

        await currentUser.save();

        alert("Profil enregistré");

    } catch (e) {
        console.log(e);
        alert("Erreur sauvegarde");
    }
}


/* AVATAR UPLOAD */
document.getElementById("file").addEventListener("change", async function(e){

    try {

        var file = e.target.files[0];
        if(!file) return;

        var parseFile = new Parse.File(file.name, file);

        await parseFile.save();

        currentUser.set("avatar", parseFile);
        await currentUser.save();

        document.getElementById("avatar").src = parseFile.url();

    } catch (e) {
        console.log(e);
    }
});


/* LOAD POSTS */
async function loadPosts(){

    try {

        var query = new Parse.Query("Posts");

        query.equalTo("owner", currentUser);
        query.descending("createdAt");

        var posts = await query.find();

        var grid = document.getElementById("grid");
        grid.innerHTML = "";

        posts.forEach(function(post){

            var image = post.get("image");
            if(!image || !image.url) return;

            var div = document.createElement("div");
            div.className = "post";

            div.innerHTML = `<img src="${image.url()}">`;

            grid.appendChild(div);

        });

    } catch (e) {
        console.log(e);
    }
}

</script>

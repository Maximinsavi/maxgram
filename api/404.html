<html>
<head>
  <title>Magram - 404</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 35px 25px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 320px;
    }

    .code {
      font-size: 60px;
      font-weight: bold;
      color: #4a6cf7;
    }

    .title {
      font-size: 20px;
      margin-top: 10px;
      font-weight: bold;
    }

    .text {
      font-size: 13px;
      color: #555;
      margin-top: 10px;
      line-height: 1.5;
    }

    a.btn {
      display: block;
      margin-top: 20px;
      padding: 12px;
      border-radius: 12px;
      background: #4a6cf7;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    a.btn:hover {
      transform: scale(1.03);
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="code">404</div>
    <div class="title">Page introuvable</div>

    <div class="text">
      Oups 😕 la page que tu cherches n’existe pas ou a été déplacée.
    </div>

    <a class="btn" href="/index.html">Retour à l’accueil</a>

  </div>

</body>
</html>

<html>
<head>
  <title>Magram</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f1a;
      color: white;
    }

    table {
      border-collapse: collapse;
      height: 100vh;
      width: 100%;
    }

    .hero {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      text-align: center;
      padding: 60px 20px;
    }

    .title {
      font-size: 60px;
      margin: 0;
      letter-spacing: 2px;
    }

    .subtitle {
      opacity: 0.8;
      font-size: 18px;
      margin-top: 10px;
    }

    .btn {
      margin-top: 20px;
      padding: 15px 25px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      background: white;
      color: black;
    }

    .section {
      padding: 40px 20px;
      text-align: center;
    }

    .card {
      background: #1c1c2e;
      padding: 20px;
      border-radius: 15px;
      margin: 10px;
      display: inline-block;
    }

    .footer {
      text-align: center;
      padding: 20px;
      opacity: 0.6;
      font-size: 14px;
    }
  </style>
</head>

<body>

<table>

  <!-- HERO -->
  <tr>
    <td class="hero">
      <h1 class="title">Magram</h1>
      <div class="subtitle">Partage. Inspire. Connecte.</div>
      <button class="btn">Commencer</button>
    </td>
  </tr>

  <!-- FEATURES -->
  <tr>
    <td class="section">
      <h2>Pourquoi Magram ?</h2>

      <div class="card">🔥 Rapide et fluide</div>
      <div class="card">📸 Feed intelligent</div>
      <div class="card">🌍 Communauté mondiale</div>
    </td>
  </tr>

  <!-- ABOUT -->
  <tr>
    <td class="section">
      <h2>Une nouvelle génération de réseau social</h2>
      <p style="opacity:0.7;">
        Magram est conçu pour connecter les gens de manière simple et moderne.
      </p>
    </td>
  </tr>

  <!-- FOOTER -->
  <tr>
    <td class="footer">
      © 2026 Magram - All rights reserved
    </td>
  </tr>

</table>

</body>
</html>

<html>
<head>
  <title>Magram</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1a1a1a;
    }

    /* TOP BAR */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 14px;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      border-bottom: 1px solid #e8e8e8;
    }

    table {
      width: 100%;
      height: 100vh;
      border-collapse: collapse;
    }

    td {
      text-align: center;
      vertical-align: middle;
      padding: 20px;
    }

    /* MAIN CARD */
    .card {
      display: inline-block;
      background: white;
      padding: 30px 20px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-width: 340px;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      margin-top: 6px;
    }

    .desc {
      font-size: 13px;
      margin-top: 15px;
      color: #444;
      line-height: 1.5;
    }

    /* BUTTONS */
    a.btn {
      display: block;
      margin: 12px auto;
      padding: 12px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      width: 85%;
      transition: 0.2s;
    }

    a.btn:hover {
      transform: scale(1.03);
    }

    .primary {
      background: #4a6cf7;
      color: white;
    }

    .secondary {
      background: #f2f4f8;
      color: #1a1a1a;
    }

    .outline {
      background: white;
      border: 1px solid #ddd;
      color: #333;
    }

    /* BOTTOM NAV */
    .bottombar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      border-top: 1px solid #e8e8e8;
      font-size: 12px;
      color: #555;
    }

    .nav {
      text-align: center;
    }
  </style>
</head>

<body>

<div class="topbar">Magram</div>

<table>
  <tr>
    <td>

      <div class="card">
        <div class="title">Bienvenue</div>
        <div class="subtitle">Une nouvelle façon de se connecter</div>

        <div class="desc">
          Magram est une application moderne conçue pour offrir une expérience
          simple, rapide et élégante de communication et d’interaction.
        </div>

        <a class="btn primary" href="/login.html">Connexion</a>
        <a class="btn secondary" href="/register.html">Enregistrer</a>
        <a class="btn outline" href="/api/bot.html">Découvrir le Bot</a>
      </div>

    </td>
  </tr>
</table>

<div class="bottombar">
  <div class="nav">Accueil</div>
  <div class="nav">Explorer</div>
  <div class="nav">Notifications</div>
  <div class="nav">Profil</div>
</div>

</body>
</html>

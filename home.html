<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

var supabaseUrl = "https://zcckclyeqawcaclzmabj.supabase.co";
var supabaseKey = "sb_publishable_Vj1M_Jkv68n4EXuMmzjNow_RI05o_jh";

var supabaseClient = supabase.createClient(
    supabaseUrl,
    supabaseKey
);


document.addEventListener("DOMContentLoaded", async function(){

    var avatar = document.getElementById("userAvatar");

    var defaultAvatar =
    "https://ui-avatars.com/api/?name=User&background=ccc&color=fff&size=128";

    var result = await supabaseClient.auth.getSession();

    var session = result.data.session;

    if(session){

        var userId = session.user.id;

        var profile = await supabaseClient
        .from("profiles")
        .select("avatar")
        .eq("id", userId)
        .single();

        if(profile.data && profile.data.avatar){
            avatar.src = profile.data.avatar;
        } else {
            avatar.src = defaultAvatar;
        }

    } else {
        avatar.src = defaultAvatar;
    }

});

</script>

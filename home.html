<html>
<head>
  <title>Magram</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f1a;
      color: white;
    }

    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
    }

    .hero h1 {
      font-size: 70px;
      margin: 0;
      letter-spacing: 2px;
    }

    .hero p {
      font-size: 20px;
      opacity: 0.8;
    }

    .btn {
      margin-top: 20px;
      padding: 15px 30px;
      background: white;
      color: black;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.1);
    }

    .section {
      padding: 80px 20px;
      text-align: center;
    }

    .cards {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      background: #1c1c2e;
      padding: 20px;
      border-radius: 15px;
      width: 250px;
    }
  </style>
</head>

<body>

  <div class="hero">
    <h1>Magram</h1>
    <p>Partage. Inspire. Connecte.</p>
    <button class="btn">Commencer</button>
  </div>

  <div class="section">
    <h2>Pourquoi Magram ?</h2>

    <div class="cards">
      <div class="card">🔥 Ultra rapide</div>
      <div class="card">📸 Feed intelligent</div>
      <div class="card">🌍 Communauté mondiale</div>
    </div>
  </div>

</body>
</html>

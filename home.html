<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MaxGram Home</title>

<style>

body {
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    background:#f5f6f8;
}


/* HEADER */

.header {
    width:100%;
    height:64px;
    background:white;
    position:sticky;
    top:0;
    border-bottom:1px solid #ddd;
    z-index:10;
}


.header td {
    padding:0 15px;
}


.logo {
    font-size:22px;
    font-weight:700;
    color:#1877f2;
}


.nav {
    display:flex;
    justify-content:center;
    gap:12px;
}


.nav a {
    width:44px;
    height:44px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:14px;
    color:#555;
    text-decoration:none;
    transition:.2s;
}


.nav a:hover {
    background:#f0f2f5;
    color:#1877f2;
}


svg {
    width:23px;
    height:23px;
}



/* PAGE */

.content {
    width:100%;
}


.block {

    background:white;
    margin:15px;
    padding:20px;
    border-radius:16px;

    box-shadow:
    0 2px 10px rgba(0,0,0,.04);

}



.block-title {

    font-size:18px;
    font-weight:600;
    margin-bottom:10px;

}



.info {

    color:#555;
    font-size:14px;

}



.action {

    display:block;
    margin-top:12px;
    padding:12px;
    border-radius:12px;

    background:#1877f2;
    color:white;
    text-align:center;

    text-decoration:none;
}



.grid {

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;

}


.card {

    background:#f5f6f8;
    padding:15px;
    border-radius:12px;

}


.number {

    font-size:22px;
    font-weight:700;

}



</style>


</head>


<body>



<!-- HEADER -->

<table class="header">

<tr>


<td width="30%">
<div class="logo">
MaxGram
</div>
</td>



<td width="40%">

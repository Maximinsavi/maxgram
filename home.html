<script src="/header.js"></script>


<div id="composer-box">

<style>

#composer-box{
    width:100%;
    background:white;
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid #e5e5e5;
    box-sizing:border-box;
}

#composer-avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    overflow:hidden;
    background:#ddd;
    flex-shrink:0;
}

#composer-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

#composer-input{
    flex:1;
    background:#f0f2f5;
    border:none;
    border-radius:22px;
    padding:12px 14px;
    font-size:14px;
    cursor:pointer;
    transition:0.15s;
}

#composer-input:active{
    transform:scale(0.98);
    background:#e4e6ea;
}

</style>

<div id="composer-avatar">
    <img id="userAvatar">
</div>

<input id="composer-input"
type="text"
readonly
placeholder="Quoi de neuf ?"
onclick="location.href='/m/publier.html'">

</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

    var avatar = document.getElementById("userAvatar");

    var defaultAvatar =
    "https://ui-avatars.com/api/?name=User&background=ccc&color=fff&size=128";

    var user = Parse.User.current();

    if(user && user.get("avatar")){

        avatar.src = user.get("avatar").url();

    } else {

        avatar.src = defaultAvatar;

    }

});
</script>

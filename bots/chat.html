<html>
<head>
  <title>Magram Bot</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1a1a1a;
    }

    /* TOP BAR */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 14px;
      text-align: center;
      font-weight: bold;
      border-bottom: 1px solid #e8e8e8;
      z-index: 10;
    }

    /* CHAT AREA */
    .container {
      padding: 80px 15px 120px;
    }

    .chat {
      max-width: 600px;
      margin: auto;
    }

    .msg {
      padding: 12px 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .user {
      background: #4a6cf7;
      color: white;
      margin-left: auto;
      width: fit-content;
      max-width: 80%;
    }

    .bot {
      background: white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      width: fit-content;
      max-width: 80%;
    }

    /* INPUT BAR */
    .inputbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      padding: 10px;
      border-top: 1px solid #e8e8e8;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
      font-size: 14px;
    }

    button {
      margin-left: 10px;
      padding: 12px 16px;
      border: none;
      background: #4a6cf7;
      color: white;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }

  </style>
</head>

<body>

<div class="topbar">🤖 Magram Bot</div>

<div class="container">
  <div class="chat" id="chat"></div>
</div>

<div class="inputbar">
  <input id="input" placeholder="Écris ton message..." />
  <button onclick="send()">Envoyer</button>
</div>

<script>
var uid = "user_" + Math.floor(Math.random() * 999999);

var chat = document.getElementById("chat");

/* LOAD FROM LOCALSTORAGE */
window.onload = function () {
  var saved = localStorage.getItem("magram_chat");
  if (saved) {
    chat.innerHTML = saved;
  }
};

/* SAVE CHAT */
function saveChat() {
  localStorage.setItem("magram_chat", chat.innerHTML);
}

/* ADD MESSAGE */
function addMessage(text, type) {
  var div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chat.appendChild(div);

  saveChat();

  window.scrollTo(0, document.body.scrollHeight);
}

/* SEND MESSAGE */
async function send() {
  var input = document.getElementById("input");
  var text = input.value;

  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  try {
    var res = await fetch(
      "https://rest-api-orcin-kappa.vercel.app/api/gemma?uid=" +
      uid +
      "&prompt=" +
      encodeURIComponent(text)
    );

    var data = await res.json();

    if (data.status) {
      addMessage("🤖 " + data.response, "bot");
    } else {
      addMessage("Erreur bot ❌", "bot");
    }

  } catch (e) {
    addMessage("Erreur serveur ❌", "bot");
  }
}
</script>

</body>
</html>

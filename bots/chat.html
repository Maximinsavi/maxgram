<html>
<head>
  <title>Magram Bot</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1a1a1a;
      transition: 0.3s;
    }

    body.dark {
      background: #0f0f1a;
      color: white;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 12px;
      text-align: center;
      font-weight: bold;
      border-bottom: 1px solid #e8e8e8;
      z-index: 10;
    }

    body.dark .topbar,
    body.dark .inputbar {
      background: #1a1a2e;
      border-color: rgba(255,255,255,0.1);
    }

    .topbtn {
      position: absolute;
      top: 10px;
      font-size: 12px;
      padding: 6px 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .mode { left: 10px; }
    .clear { right: 10px; background: #ff4d4d; color: white; }

    .container {
      padding: 70px 15px 120px;
    }

    .chat {
      max-width: 600px;
      margin: auto;
    }

    .msg {
      padding: 12px;
      border-radius: 14px;
      margin-bottom: 10px;
      font-size: 14px;
      position: relative;
      word-wrap: break-word;
    }

    .user {
      background: #4a6cf7;
      color: white;
      margin-left: auto;
      width: fit-content;
      max-width: 80%;
    }

    .bot {
      background: white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      width: fit-content;
      max-width: 80%;
    }

    body.dark .bot {
      background: #1c1c2e;
      color: white;
    }

    .actions {
      margin-top: 5px;
      font-size: 11px;
      opacity: 0.7;
      cursor: pointer;
    }

    .inputbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      padding: 10px;
      border-top: 1px solid #e8e8e8;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
    }

    button {
      margin-left: 10px;
      padding: 12px 16px;
      border: none;
      background: #4a6cf7;
      color: white;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="topbar">
  🤖 Magram Bot
  <button class="topbtn mode" onclick="toggleMode()">🌙</button>
  <button class="topbtn clear" onclick="clearChat()">Clear</button>
</div>

<div class="container">
  <div class="chat" id="chat"></div>
</div>

<div class="inputbar">
  <input id="input" placeholder="Écris ton message..." />
  <button onclick="send()">Envoyer</button>
</div>

<script>
var uid = "user_" + Math.floor(Math.random() * 999999);
var chat = document.getElementById("chat");

/* LOAD ALL DATA */
window.onload = function () {
  var savedChat = localStorage.getItem("magram_chat");
  var savedMode = localStorage.getItem("magram_mode");

  if (savedChat) chat.innerHTML = savedChat;

  if (savedMode === "dark") {
    document.body.classList.add("dark");
  }
};

/* SAVE CHAT */
function saveChat() {
  localStorage.setItem("magram_chat", chat.innerHTML);
}

/* SAVE MODE */
function saveMode() {
  localStorage.setItem("magram_mode",
    document.body.classList.contains("dark") ? "dark" : "light"
  );
}

/* ADD MESSAGE */
function addMessage(text, type) {
  var div = document.createElement("div");
  div.className = "msg " + type;

  div.innerHTML = `
    <div>${text}</div>
    <div class="actions">
      <span onclick="copyText(this)">📋 copier</span> |
      <span onclick="deleteMsg(this)">❌ supprimer</span>
    </div>
  `;

  chat.appendChild(div);
  saveChat();
}

/* COPY */
function copyText(el) {
  var text = el.parentElement.parentElement.querySelector("div").innerText;
  navigator.clipboard.writeText(text);
}

/* DELETE WITH CONFIRM */
function deleteMsg(el) {
  var ok = confirm("Supprimer ce message ?");
  if (!ok) return;

  el.parentElement.parentElement.remove();
  saveChat();
}

/* CLEAR CHAT WITH CONFIRM */
function clearChat() {
  var ok = confirm("Supprimer tout le chat ?");
  if (!ok) return;

  chat.innerHTML = "";
  localStorage.removeItem("magram_chat");
}

/* TOGGLE MODE */
function toggleMode() {
  document.body.classList.toggle("dark");
  saveMode();
}

/* SEND MESSAGE */
async function send() {
  var input = document.getElementById("input");
  var text = input.value;

  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  try {
    var res = await fetch(
      "https://rest-api-orcin-kappa.vercel.app/api/gemma?uid=" +
      uid +
      "&prompt=" +
      encodeURIComponent(text)
    );

    var data = await res.json();

    if (data.status) {
      addMessage("🤖 " + data.response, "bot");
    } else {
      addMessage("Erreur bot ❌", "bot");
    }

  } catch (e) {
    addMessage("Erreur serveur ❌", "bot");
  }
}
</script>

</body>
</html>

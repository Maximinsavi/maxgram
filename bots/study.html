<html>
<head>
  <title>Magram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI";
      background:#f5f7fb;
      background-size:cover;
      background-position:center;
    }

    body.dark{background:#0f0f1a;color:white}

    .topbar{
      position:fixed;
      top:0;left:0;right:0;
      height:50px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:600;
      background:rgba(255,255,255,0.85);
      backdrop-filter:blur(10px);
      z-index:9999;
      border-bottom:1px solid #eee;
    }

    body.dark .topbar{
      background:rgba(20,20,30,0.85);
      border-color:#222;
    }

    .iconBtn{
      position:absolute;
      top:12px;
      width:22px;
      height:22px;
      cursor:pointer;
      opacity:.8;
    }

    .left{left:10px}
    .mid{left:45px}
    .right{right:10px}

    .chat{
      position:absolute;
      top:50px;
      bottom:80px;
      left:0;
      right:0;
      overflow-y:auto;
      padding:10px;
    }

    .msg{
      display:inline-block;
      max-width:78%;
      padding:10px 12px;
      margin:8px 0;
      border-radius:18px;
      font-size:14px;
      word-break:break-word;
      clear:both;
      animation:pop .15s ease;
    }

    @keyframes pop{
      from{opacity:0;transform:translateY(6px)}
      to{opacity:1}
    }

    .user{background:#0a84ff;color:white;float:right}
    .bot{background:white;float:left;box-shadow:0 2px 10px rgba(0,0,0,.06)}

    body.dark .bot{background:#1c1c2e}

    .msgText{white-space:pre-wrap}

    .actions{
      display:flex;
      gap:10px;
      margin-top:6px;
      opacity:.6;
    }

    .icon{
      width:16px;
      height:16px;
      cursor:pointer;
    }

    /* REPLY BAR */
    .replyBar{
      position:fixed;
      bottom:60px;
      left:0;right:0;
      background:rgba(255,255,255,0.9);
      backdrop-filter:blur(10px);
      padding:8px 10px;
      display:none;
      justify-content:space-between;
      align-items:center;
      font-size:12px;
      border-top:1px solid #ddd;
    }

    body.dark .replyBar{
      background:rgba(20,20,30,0.9);
      border-color:#222;
      color:white;
    }

    .replyText{
      flex:1;
      opacity:.8;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }

    .closeReply{
      width:18px;
      height:18px;
      cursor:pointer;
    }

    .inputbar{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      display:flex;
      padding:8px;
      gap:6px;
      background:rgba(255,255,255,0.9);
    }

    input{
      flex:1;
      padding:12px;
      border-radius:18px;
      border:1px solid #ddd;
      outline:none;
    }

    button{
      padding:12px;
      border:none;
      border-radius:14px;
      background:#0a84ff;
      color:white;
    }

  </style>
</head>

<body>

<div class="topbar">
  Magram

  <svg class="iconBtn left" onclick="toggleMode()" viewBox="0 0 24 24">
    <path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" stroke="currentColor" stroke-width="2"/>
  </svg>

  <svg class="iconBtn mid" onclick="pickBg()" viewBox="0 0 24 24">
    <path d="M4 4H20V20H4V4Z" stroke="currentColor" stroke-width="2"/>
  </svg>

  <svg class="iconBtn right" onclick="clearAll()" viewBox="0 0 24 24">
    <path d="M3 6H21" stroke="currentColor" stroke-width="2"/>
    <path d="M8 6V4H16V6" stroke="currentColor" stroke-width="2"/>
    <path d="M6 6L7 20H17L18 6" stroke="currentColor" stroke-width="2"/>
  </svg>
</div>

<div class="chat" id="chat"></div>

<div class="replyBar" id="replyBar">
  <div class="replyText" id="replyText"></div>

  <svg class="closeReply" onclick="clearReply()" viewBox="0 0 24 24">
    <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2"/>
  </svg>
</div>

<div class="inputbar">
  <input id="input" placeholder="Message..." />
  <button onclick="send()">Send</button>
</div>

<script>

var chat=document.getElementById("chat");
var replyTo=null;

/* SCROLL */
function scroll(){
  chat.scrollTop = chat.scrollHeight;
}

/* ADD MSG */
function add(text,type){

  let d=document.createElement("div");
  d.className="msg "+type;

  d.innerHTML=`
    <div class="msgText">${text}</div>

    <div class="actions">

      <!-- COPY -->
      <svg class="icon" onclick="copyMsg(this)" viewBox="0 0 24 24">
        <path d="M8 8H18V18H8V8Z" stroke="currentColor" stroke-width="2"/>
      </svg>

      <!-- REPLY -->
      <svg class="icon" onclick="replyMsg(this)" viewBox="0 0 24 24">
        <path d="M9 10L4 15L9 20" stroke="currentColor" stroke-width="2"/>
        <path d="M20 4V11C20 14 18 16 15 16H4" stroke="currentColor" stroke-width="2"/>
      </svg>

      <!-- DELETE -->
      <svg class="icon" onclick="deleteMsg(this)" viewBox="0 0 24 24">
        <path d="M3 6H21" stroke="currentColor" stroke-width="2"/>
        <path d="M8 6V4H16V6" stroke="currentColor" stroke-width="2"/>
        <path d="M6 6L7 20H17L18 6" stroke="currentColor" stroke-width="2"/>
      </svg>

    </div>
  `;

  chat.appendChild(d);
  scroll();
}

/* COPY */
function copyMsg(el){
  navigator.clipboard.writeText(el.closest(".msg").innerText);
}

/* DELETE */
function deleteMsg(el){
  if(confirm("Supprimer ?")){
    el.closest(".msg").remove();
  }
}

/* REPLY FIXED */
function replyMsg(el){
  let msg = el.closest(".msg");
  replyTo = msg.querySelector(".msgText").innerText;

  document.getElementById("replyText").innerText = replyTo;
  document.getElementById("replyBar").style.display="flex";
}

/* CLEAR REPLY */
function clearReply(){
  replyTo=null;
  document.getElementById("replyBar").style.display="none";
}

/* SEND */
async function send(){

  let i=document.getElementById("input");
  let t=i.value.trim();
  if(!t) return;

  let finalText = t;

  if(replyTo){
    finalText = "↪️ " + replyTo + "\n\n" + t;
  }

  add(finalText,"user");

  i.value="";
  clearReply();

  let r=await fetch(
    "https://rest-api-orcin-kappa.vercel.app/api/gemma?uid=demo"+
    "&prompt="+encodeURIComponent(t)
  );

  let d=await r.json();

  if(d.status){
    add(d.response,"bot");
  }
}

/* MODE */
function toggleMode(){
  document.body.classList.toggle("dark");
}

/* BG */
function pickBg(){
  let input=document.createElement("input");
  input.type="file";
  input.accept="image/*";

  input.onchange=()=>{
    let file=input.files[0];
    let reader=new FileReader();

    reader.onload=()=>{
      document.body.style.backgroundImage="url("+reader.result+")";
    };

    reader.readAsDataURL(file);
  };

  input.click();
}

/* CLEAR */
function clearAll(){
  chat.innerHTML="";
}

</script>

</body>
</html>

<html>
<head>
  <title>Magram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI";
      background:#f5f7fb;
      overflow:hidden;
    }

    body.dark{background:#0f0f1a;color:white}

    /* HEADER FIX */
    .topbar{
      position:fixed;
      top:0;left:0;right:0;
      height:50px;
      background:rgba(255,255,255,0.85);
      backdrop-filter:blur(12px);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:600;
      z-index:1000;
      border-bottom:1px solid #eee;
    }

    body.dark .topbar{
      background:rgba(20,20,30,0.85);
      border-color:#222;
    }

    .mode,.clear,.bg{
      position:absolute;
      top:10px;
      padding:5px 10px;
      border:none;
      border-radius:8px;
      font-size:11px;
    }

    .mode{left:8px}
    .bg{right:70px;background:#0a84ff;color:white}
    .clear{right:8px;background:#ff3b30;color:white}

    /* CHAT FIX SCROLL */
    .chat{
      position:absolute;
      top:50px;
      bottom:120px;
      left:0;
      right:0;
      overflow-y:auto;
      padding:10px;
      -webkit-overflow-scrolling:touch;
    }

    .msg{
      display:inline-block;
      max-width:78%;
      padding:10px 12px;
      margin:6px 0;
      border-radius:18px;
      font-size:14px;
      word-break:break-word;
      clear:both;
      position:relative;
      transition:transform .2s ease;
    }

    .user{
      background:#0a84ff;
      color:white;
      float:right;
      border-bottom-right-radius:6px;
    }

    .bot{
      background:white;
      float:left;
      border-bottom-left-radius:6px;
      box-shadow:0 2px 10px rgba(0,0,0,.06);
    }

    body.dark .bot{background:#1c1c2e}

    .actions{
      font-size:10px;
      opacity:.6;
      margin-top:5px;
      display:flex;
      gap:8px;
    }

    /* REPLY BAR (IMPORTANT FIX) */
    .replyBar{
      position:fixed;
      bottom:60px;
      left:0;right:0;
      background:rgba(255,255,255,0.95);
      backdrop-filter:blur(10px);
      padding:8px 10px;
      font-size:12px;
      display:none;
      border-top:1px solid #ddd;
      z-index:999;
    }

    body.dark .replyBar{
      background:rgba(20,20,30,0.9);
      border-color:#222;
    }

    /* INPUT */
    .inputbar{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      display:flex;
      padding:8px;
      gap:6px;
      background:rgba(255,255,255,0.9);
      backdrop-filter:blur(10px);
      z-index:1000;
    }

    input{
      flex:1;
      padding:12px;
      border-radius:18px;
      border:1px solid #ddd;
      outline:none;
    }

    button{
      padding:12px;
      border:none;
      border-radius:14px;
      background:#0a84ff;
      color:white;
    }

  </style>
</head>

<body>

<div class="topbar">
  Magram
  <button class="mode" onclick="toggle()">🌙</button>
  <button class="bg" onclick="setBg()">🖼</button>
  <button class="clear" onclick="clearAll()">X</button>
</div>

<!-- REPLY DISPLAY FIX -->
<div class="replyBar" id="replyBar"></div>

<div class="chat" id="chat"></div>

<div class="inputbar">
  <input id="input" placeholder="Message..." />
  <button onclick="send()">Send</button>
</div>

<script>

var uid="u_"+Math.random().toString(36).slice(2);
var chat=document.getElementById("chat");
var replyTo=null;
var autoScroll=true;

/* DETECT USER SCROLL */
chat.addEventListener("scroll",()=>{
  let nearBottom = chat.scrollTop + chat.clientHeight >= chat.scrollHeight - 50;
  autoScroll = nearBottom;
});

/* SCROLL FIX */
function scroll(){
  if(autoScroll){
    chat.scrollTo({top:chat.scrollHeight,behavior:"smooth"});
  }
}

/* REPLY BAR UI */
function showReplyBar(text){
  let bar=document.getElementById("replyBar");
  bar.style.display="block";
  bar.innerText="Replying to: "+text;
}

function clearReplyBar(){
  let bar=document.getElementById("replyBar");
  bar.style.display="none";
  bar.innerText="";
}

/* ADD MESSAGE */
function add(text,type){

  let d=document.createElement("div");
  d.className="msg "+type;

  d.innerHTML=text+`
    <div class="actions">
      <span onclick="copy(this)">copy</span>
      <span onclick="del(this)">del</span>
      <span onclick="setReply(this)">reply</span>
    </div>
  `;

  enableSwipe(d);

  chat.appendChild(d);
  scroll();
}

/* COPY */
function copy(e){
  navigator.clipboard.writeText(e.parentElement.parentElement.innerText);
}

/* DELETE */
function del(e){
  if(confirm("delete?")){
    e.parentElement.parentElement.remove();
  }
}

/* REPLY */
function setReply(e){
  replyTo=e.parentElement.parentElement.innerText;
  showReplyBar(replyTo);
}

/* SWIPE FIX WHATSAPP */
function enableSwipe(el){

  let startX=0;
  let moveX=0;

  el.addEventListener("touchstart",e=>{
    startX=e.touches[0].clientX;
  });

  el.addEventListener("touchmove",e=>{
    moveX=e.touches[0].clientX-startX;
    if(moveX<0){
      el.style.transform=`translateX(${moveX}px)`;
    }
  });

  el.addEventListener("touchend",()=>{
    if(moveX<-80){
      setReply({parentElement:{parentElement:el}});
      showReplyBar(el.innerText);
    }

    el.style.transform="translateX(0)";
    moveX=0;
  });
}

/* SEND */
async function send(){

  let i=document.getElementById("input");
  let t=i.value.trim();
  if(!t) return;

  add(t,"user");

  i.value="";

  chat.appendChild(document.createElement("div"));

  try{

    let r=await fetch(
      "https://rest-api-orcin-kappa.vercel.app/api/gemma?uid="+uid+
      "&prompt="+encodeURIComponent(t)
    );

    let d=await r.json();

    if(d.status){
      add("🤖 "+d.response,"bot");
    }

    clearReplyBar();
    replyTo=null;

  }catch(e){
    add("error","bot");
  }
}

/* BG */
function setBg(){
  let url=prompt("Image URL:");
  if(url){
    document.body.style.backgroundImage="url("+url+")";
  }
}

/* MODE */
function toggle(){
  document.body.classList.toggle("dark");
}

/* CLEAR */
function clearAll(){
  chat.innerHTML="";
  clearReplyBar();
}

</script>

</body>
</html>

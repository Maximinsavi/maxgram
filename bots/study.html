<html>
<head>
  <title>Magram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI";
      background:#f5f7fb;
      background-size:cover;
      background-position:center;
    }

    body.dark{
      background:#0f0f1a;
      color:white;
    }

    .topbar{
      position:fixed;
      top:0;left:0;right:0;
      height:50px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:600;
      background:rgba(255,255,255,0.85);
      backdrop-filter:blur(10px);
      border-bottom:1px solid #eee;
      z-index:1000;
    }

    body.dark .topbar{
      background:rgba(20,20,30,0.85);
      border-color:#222;
    }

    .btn{
      position:absolute;
      top:10px;
      padding:6px 10px;
      border:none;
      border-radius:8px;
      font-size:11px;
      cursor:pointer;
    }

    .bg{right:70px;background:#0a84ff;color:white}
    .mode{left:8px;background:#111;color:white}
    body.dark .mode{background:#fff;color:#000}
    .clear{right:8px;background:#ff3b30;color:white}

    .chat{
      position:absolute;
      top:50px;
      bottom:140px;
      left:0;
      right:0;
      overflow-y:auto;
      padding:10px;
    }

    .msg{
      display:inline-block;
      max-width:78%;
      padding:10px 12px;
      margin:8px 0;
      border-radius:18px;
      font-size:14px;
      word-break:break-word;
      clear:both;
      animation:pop .15s ease;
      position:relative;
    }

    @keyframes pop{
      from{opacity:0;transform:translateY(6px)}
      to{opacity:1;transform:translateY(0)}
    }

    .user{background:#0a84ff;color:white;float:right}
    .bot{background:white;float:left;box-shadow:0 2px 10px rgba(0,0,0,.06)}

    body.dark .bot{
      background:#1c1c2e;
      color:white;
    }

    .msgText{
      white-space:pre-wrap;
    }

    /* ACTIONS SVG */
    .actions{
      display:flex;
      gap:10px;
      margin-top:6px;
      opacity:.6;
    }

    .icon{
      width:16px;
      height:16px;
      cursor:pointer;
      transition:.2s;
    }

    .icon:hover{
      transform:scale(1.15);
      opacity:1;
    }

    /* REPLY STYLE */
    .replyBlock{
      border-left:3px solid #0a84ff;
      padding-left:8px;
      margin-bottom:6px;
      font-size:12px;
      opacity:.75;
    }

    .inputbar{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      display:flex;
      padding:8px;
      gap:6px;
      background:rgba(255,255,255,0.9);
      backdrop-filter:blur(10px);
    }

    input{
      flex:1;
      padding:12px;
      border-radius:18px;
      border:1px solid #ddd;
      outline:none;
    }

    button{
      padding:12px;
      border:none;
      border-radius:14px;
      background:#0a84ff;
      color:white;
    }

  </style>
</head>

<body>

<div class="topbar">
  Magram
  <button class="btn mode" onclick="toggleMode()">🌙</button>
  <button class="btn bg" onclick="pickBg()">🖼</button>
  <button class="btn clear" onclick="clearAll()">X</button>
</div>

<div class="chat" id="chat"></div>

<div class="inputbar">
  <input id="input" placeholder="Message..." />
  <button onclick="send()">Send</button>
</div>

<script>

var chat=document.getElementById("chat");
var replyTo=null;

/* SCROLL */
function scroll(){
  chat.scrollTop = chat.scrollHeight;
}

/* ADD MESSAGE */
function add(text,type,reply){

  let d=document.createElement("div");
  d.className="msg "+type;

  let replyHtml = reply ? `<div class="replyBlock">${reply}</div>` : "";

  d.innerHTML=`
    ${replyHtml}
    <div class="msgText">${text}</div>

    <div class="actions">

      <!-- COPY -->
      <svg class="icon" onclick="copyMsg(this)" viewBox="0 0 24 24" fill="none">
        <path d="M8 8H18V18H8V8Z" stroke="currentColor" stroke-width="2"/>
        <path d="M6 16H6C5 16 4 15 4 14V6C4 5 5 4 6 4H14C15 4 16 5 16 6V6" stroke="currentColor" stroke-width="2"/>
      </svg>

      <!-- REPLY -->
      <svg class="icon" onclick="replyMsg(this)" viewBox="0 0 24 24" fill="none">
        <path d="M9 10L4 15L9 20" stroke="currentColor" stroke-width="2"/>
        <path d="M20 4V11C20 14 18 16 15 16H4" stroke="currentColor" stroke-width="2"/>
      </svg>

      <!-- DELETE -->
      <svg class="icon" onclick="deleteMsg(this)" viewBox="0 0 24 24" fill="none">
        <path d="M3 6H21" stroke="currentColor" stroke-width="2"/>
        <path d="M8 6V4H16V6" stroke="currentColor" stroke-width="2"/>
        <path d="M6 6L7 20H17L18 6" stroke="currentColor" stroke-width="2"/>
      </svg>

    </div>
  `;

  chat.appendChild(d);
  scroll();
}

/* COPY */
function copyMsg(el){
  let msg = el.closest(".msg");
  navigator.clipboard.writeText(msg.innerText);
}

/* DELETE */
function deleteMsg(el){
  if(confirm("Supprimer ?")){
    el.closest(".msg").remove();
  }
}

/* REPLY */
function replyMsg(el){
  let msg = el.closest(".msg");
  replyTo = msg.innerText;
}

/* SEND */
async function send(){

  let i=document.getElementById("input");
  let t=i.value.trim();
  if(!t) return;

  add(t,"user",replyTo);

  i.value="";

  try{

    let r=await fetch(
      "https://rest-api-orcin-kappa.vercel.app/api/gemma?uid=demo"+
      "&prompt="+encodeURIComponent(t)
    );

    let d=await r.json();

    if(d.status){
      add(d.response,"bot",null);
    }

  }catch(e){
    add("error","bot");
  }

  replyTo=null;
}

</script>

</body>
</html>

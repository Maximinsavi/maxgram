<html>
<head>
  <title>Magram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI";
      background:#f5f7fb;
      background-size:cover;
      background-position:center;
      transition:.2s;
      overflow:hidden;
    }

    body.dark{background:#0f0f1a;color:white}

    .topbar{
      position:fixed;
      top:0;left:0;right:0;
      height:50px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:600;
      background:rgba(255,255,255,0.85);
      backdrop-filter:blur(10px);
      border-bottom:1px solid #eee;
      z-index:1000;
    }

    body.dark .topbar{
      background:rgba(20,20,30,0.85);
      border-color:#222;
    }

    .btn{
      position:absolute;
      top:10px;
      padding:6px 10px;
      border:none;
      border-radius:8px;
      font-size:11px;
    }

    .mode{left:8px}
    .bg{right:70px;background:#0a84ff;color:white}
    .clear{right:8px;background:#ff3b30;color:white}

    .chat{
      position:absolute;
      top:50px;
      bottom:130px;
      left:0;
      right:0;
      overflow-y:auto;
      padding:10px;
    }

    .msg{
      display:inline-block;
      max-width:78%;
      padding:10px 12px;
      margin:6px 0;
      border-radius:18px;
      font-size:14px;
      word-break:break-word;
      clear:both;
      animation:fade .15s ease;
    }

    @keyframes fade{
      from{opacity:0;transform:translateY(6px)}
      to{opacity:1}
    }

    .user{background:#0a84ff;color:white;float:right}
    .bot{background:white;float:left;box-shadow:0 2px 10px rgba(0,0,0,.06)}
    body.dark .bot{background:#1c1c2e}

    /* REPLY PREVIEW BAR */
    .replyBar{
      position:fixed;
      bottom:60px;
      left:0;right:0;
      background:rgba(255,255,255,0.95);
      backdrop-filter:blur(10px);
      padding:8px 10px;
      font-size:12px;
      display:none;
      border-top:1px solid #ddd;
      z-index:999;
    }

    body.dark .replyBar{
      background:rgba(20,20,30,0.9);
      border-color:#222;
    }

    .inputbar{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      display:flex;
      gap:6px;
      padding:8px;
      background:rgba(255,255,255,0.9);
      backdrop-filter:blur(10px);
      z-index:1000;
    }

    input{
      flex:1;
      padding:12px;
      border-radius:18px;
      border:1px solid #ddd;
      outline:none;
    }

    button{
      padding:12px;
      border:none;
      border-radius:14px;
      background:#0a84ff;
      color:white;
    }

  </style>
</head>

<body>

<div class="topbar">
  Magram
  <button class="btn mode" onclick="toggle()">🌙</button>
  <button class="btn bg" onclick="pickBg()">🖼</button>
  <button class="btn clear" onclick="clearAll()">X</button>
</div>

<div class="chat" id="chat"></div>

<!-- REPLY PREVIEW -->
<div class="replyBar" id="replyBar"></div>

<div class="inputbar">
  <input id="input" placeholder="Message..." />
  <button onclick="send()">Send</button>

  <input type="file" id="bgFile" accept="image/*" style="display:none">
</div>

<script>

var uid="u_"+Math.random().toString(36).slice(2);
var chat=document.getElementById("chat");
var replyTo=null;

/* ---------------- LOCAL STORAGE LOAD ---------------- */
window.onload=()=>{

  let savedChat=localStorage.getItem("chat");
  if(savedChat) chat.innerHTML=savedChat;

  let bg=localStorage.getItem("bg");
  if(bg) document.body.style.backgroundImage="url("+bg+")";

  let reply=localStorage.getItem("reply");
  if(reply){
    replyTo=reply;
    showReply(replyTo);
  }

  scroll();
};

/* ---------------- SAVE ---------------- */
function save(){
  localStorage.setItem("chat",chat.innerHTML);
  if(replyTo) localStorage.setItem("reply",replyTo);
}

/* ---------------- SCROLL ---------------- */
function scroll(){
  chat.scrollTop=chat.scrollHeight;
}

/* ---------------- MESSAGE ---------------- */
function add(text,type){

  let d=document.createElement("div");
  d.className="msg "+type;
  d.innerHTML=text;

  chat.appendChild(d);
  scroll();

  save();
}

/* ---------------- REPLY UI ---------------- */
function showReply(text){
  let bar=document.getElementById("replyBar");
  bar.style.display="block";
  bar.innerText="Replying to: "+text;
}

function clearReply(){
  let bar=document.getElementById("replyBar");
  bar.style.display="none";
  bar.innerText="";
  replyTo=null;
  localStorage.removeItem("reply");
}

/* ---------------- SEND ---------------- */
async function send(){

  let i=document.getElementById("input");
  let t=i.value.trim();
  if(!t) return;

  add(t,"user");

  i.value="";

  try{

    let r=await fetch(
      "https://rest-api-orcin-kappa.vercel.app/api/gemma?uid="+uid+
      "&prompt="+encodeURIComponent(t)
    );

    let d=await r.json();

    if(d.status){
      add("🤖 "+d.response,"bot");
    }

    clearReply();

  }catch(e){
    add("error","bot");
  }
}

/* ---------------- BG FROM GALLERY ---------------- */
function pickBg(){

  let input=document.getElementById("bgFile");

  input.onchange=()=>{

    let file=input.files[0];
    let reader=new FileReader();

    reader.onload=()=>{

      document.body.style.backgroundImage="url("+reader.result+")";

      localStorage.setItem("bg",reader.result);
    };

    reader.readAsDataURL(file);
  };

  input.click();
}

/* ---------------- MODE ---------------- */
function toggle(){
  document.body.classList.toggle("dark");
}

/* ---------------- CLEAR ---------------- */
function clearAll(){
  chat.innerHTML="";
  localStorage.removeItem("chat");
  clearReply();
}

</script>

</body>
</html>

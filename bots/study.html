<html>
<head>
  <title>Magram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI";
      background:#f5f7fb;
      transition:.2s;
      overflow:hidden;
    }

    body.dark{background:#0f0f1a;color:white}

    .topbar{
      position:fixed;
      top:0;left:0;right:0;
      background:rgba(255,255,255,0.9);
      backdrop-filter:blur(10px);
      padding:10px;
      text-align:center;
      font-weight:600;
      z-index:10;
    }

    .mode,.clear,.bg{
      position:absolute;
      top:8px;
      padding:5px 10px;
      border:none;
      border-radius:8px;
      font-size:11px;
    }

    .mode{left:8px}
    .clear{right:8px;background:#ff3b30;color:white}
    .bg{right:70px;background:#0a84ff;color:white}

    .chat{
      padding:70px 10px 120px;
      overflow-y:auto;
      height:100vh;
    }

    .msg{
      display:inline-block;
      max-width:78%;
      padding:10px 12px;
      margin:6px 0;
      border-radius:18px;
      font-size:14px;
      word-break:break-word;
      clear:both;
      position:relative;
      transition:transform .2s ease;
      touch-action:pan-y;
    }

    .user{
      background:#0a84ff;
      color:white;
      float:right;
      border-bottom-right-radius:6px;
    }

    .bot{
      background:white;
      float:left;
      border-bottom-left-radius:6px;
      box-shadow:0 2px 10px rgba(0,0,0,.06);
    }

    body.dark .bot{background:#1c1c2e}

    .actions{
      font-size:10px;
      opacity:.6;
      margin-top:5px;
      display:flex;
      gap:8px;
    }

    .replyBox{
      font-size:10px;
      opacity:.6;
      border-left:2px solid #999;
      padding-left:5px;
      margin-bottom:4px;
    }

    .inputbar{
      position:fixed;
      bottom:0;left:0;right:0;
      background:rgba(255,255,255,0.9);
      backdrop-filter:blur(10px);
      display:flex;
      padding:8px;
      gap:6px;
    }

    input{
      flex:1;
      padding:12px;
      border-radius:18px;
      border:1px solid #ddd;
      outline:none;
    }

    button{
      padding:12px;
      border:none;
      border-radius:14px;
      background:#0a84ff;
      color:white;
      font-size:13px;
    }

  </style>
</head>

<body>

<div class="topbar">
  Magram
  <button class="mode" onclick="toggle()">🌙</button>
  <button class="bg" onclick="setBg()">🖼</button>
  <button class="clear" onclick="clearAll()">X</button>
</div>

<div class="chat" id="chat"></div>

<div class="inputbar">
  <input id="input" placeholder="Message..." />
  <button onclick="send()">Send</button>
</div>

<script>

var uid="u_"+Math.random().toString(36).slice(2);
var chat=document.getElementById("chat");
var replyTo=null;

/* SCROLL */
function scroll(){
  chat.scrollTop=chat.scrollHeight;
}

/* ADD MSG */
function add(text,type,reply){

  let d=document.createElement("div");
  d.className="msg "+type;

  let html="";

  if(reply){
    html+=`<div class="replyBox">${reply}</div>`;
  }

  d.innerHTML=html+text+`
    <div class="actions">
      <span onclick="copy(this)">copy</span>
      <span onclick="del(this)">del</span>
      <span onclick="setReply(this)">reply</span>
    </div>
  `;

  enableSwipe(d);

  chat.appendChild(d);
  scroll();
}

/* COPY */
function copy(e){
  navigator.clipboard.writeText(e.parentElement.parentElement.innerText);
}

/* DELETE */
function del(e){
  if(confirm("delete?")){
    e.parentElement.parentElement.remove();
  }
}

/* REPLY */
function setReply(e){
  replyTo=e.parentElement.parentElement.innerText;
}

/* SWIPE WHATSAPP */
function enableSwipe(el){

  let startX=0;
  let moveX=0;

  el.addEventListener("touchstart",e=>{
    startX=e.touches[0].clientX;
  });

  el.addEventListener("touchmove",e=>{
    moveX=e.touches[0].clientX-startX;

    if(moveX<0){
      el.style.transform=`translateX(${moveX}px)`;
    }
  });

  el.addEventListener("touchend",()=>{

    if(moveX<-80){
      el.style.transform="translateX(-120px)";
      setTimeout(()=>el.style.transform="translateX(0px)",200);
    }else{
      el.style.transform="translateX(0px)";
    }

    moveX=0;
  });
}

/* SEND */
async function send(){

  let i=document.getElementById("input");
  let t=i.value.trim();
  if(!t) return;

  add(t,"user");

  i.value="";

  try{

    let r=await fetch(
      "https://rest-api-orcin-kappa.vercel.app/api/gemma?uid="+uid+
      "&prompt="+encodeURIComponent(t)
    );

    let d=await r.json();

    if(d.status){
      add("🤖 "+d.response,"bot",replyTo);
    }

    replyTo=null;

  }catch(e){
    add("error","bot");
  }
}

/* BG */
function setBg(){
  let url=prompt("Image URL:");
  if(url){
    document.body.style.backgroundImage="url("+url+")";
  }
}

/* MODE */
function toggle(){
  document.body.classList.toggle("dark");
}

/* CLEAR */
function clearAll(){
  chat.innerHTML="";
}

</script>

</body>
</html>

<html>
<head>
  <title>Magram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI";
      background:#f5f7fb;
      background-size:cover;
      background-position:center;
      overflow:hidden;
    }

    body.dark{
      background:#0f0f1a;
      color:white;
    }

    /* HEADER */
    .topbar{
      position:fixed;
      top:0;left:0;right:0;
      height:50px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:600;
      background:rgba(255,255,255,0.85);
      backdrop-filter:blur(10px);
      border-bottom:1px solid #eee;
      z-index:9999;
    }

    body.dark .topbar{
      background:rgba(20,20,30,0.85);
      border-color:#222;
    }

    .iconBtn{
      position:absolute;
      top:12px;
      width:22px;
      height:22px;
      cursor:pointer;
      opacity:.8;
    }

    .iconBtn:hover{opacity:1}

    .left{left:10px}
    .mid{left:42px}
    .right{right:10px}

    /* CHAT */
    .chat{
      position:absolute;
      top:50px;
      bottom:70px;
      left:0;
      right:0;
      overflow-y:auto;
      padding:10px;
    }

    .msg{
      display:inline-block;
      max-width:78%;
      padding:10px 12px;
      margin:8px 0;
      border-radius:18px;
      font-size:14px;
      word-break:break-word;
      clear:both;
      animation:pop .15s ease;
    }

    @keyframes pop{
      from{opacity:0;transform:translateY(6px)}
      to{opacity:1}
    }

    .user{background:#0a84ff;color:white;float:right}
    .bot{background:white;float:left;box-shadow:0 2px 10px rgba(0,0,0,.06)}

    body.dark .bot{
      background:#1c1c2e;
      color:white;
    }

    .msgText{white-space:pre-wrap}

    .actions{
      display:flex;
      gap:10px;
      margin-top:6px;
      opacity:.6;
    }

    .icon{
      width:16px;
      height:16px;
      cursor:pointer;
    }

    /* INPUT */
    .inputbar{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      display:flex;
      padding:8px;
      gap:6px;
      background:rgba(255,255,255,0.9);
      backdrop-filter:blur(10px);
    }

    input{
      flex:1;
      padding:12px;
      border-radius:18px;
      border:1px solid #ddd;
      outline:none;
    }

    button{
      padding:12px;
      border:none;
      border-radius:14px;
      background:#0a84ff;
      color:white;
    }

    input[type="file"]{display:none}
  </style>
</head>

<body>

<!-- HEADER SVG ICONS -->
<div class="topbar">
  Magram

  <!-- MODE -->
  <svg class="iconBtn left" onclick="toggleMode()" viewBox="0 0 24 24" fill="none">
    <path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" stroke="currentColor" stroke-width="2"/>
  </svg>

  <!-- BG -->
  <svg class="iconBtn mid" onclick="pickBg()" viewBox="0 0 24 24" fill="none">
    <path d="M4 4H20V20H4V4Z" stroke="currentColor" stroke-width="2"/>
    <path d="M4 16L9 11L13 15L16 12L20 16" stroke="currentColor" stroke-width="2"/>
  </svg>

  <!-- CLEAR -->
  <svg class="iconBtn right" onclick="clearAll()" viewBox="0 0 24 24" fill="none">
    <path d="M3 6H21" stroke="currentColor" stroke-width="2"/>
    <path d="M8 6V4H16V6" stroke="currentColor" stroke-width="2"/>
    <path d="M6 6L7 20H17L18 6" stroke="currentColor" stroke-width="2"/>
  </svg>

</div>

<div class="chat" id="chat"></div>

<div class="inputbar">
  <input id="input" placeholder="Message..." />
  <button onclick="send()">Send</button>
</div>

<input type="file" id="bgFile" accept="image/*">

<script>

var chat=document.getElementById("chat");
var replyTo=null;

/* LOAD */
window.onload=()=>{

  let saved = localStorage.getItem("chat");
  if(saved) chat.innerHTML = saved;

  let bg = localStorage.getItem("bg");
  if(bg) document.body.style.backgroundImage="url("+bg+")";

  let mode = localStorage.getItem("mode");
  if(mode==="dark") document.body.classList.add("dark");

  scroll();
};

/* SAVE */
function save(){
  localStorage.setItem("chat", chat.innerHTML);
}

/* SCROLL */
function scroll(){
  chat.scrollTop = chat.scrollHeight;
}

/* ADD MSG */
function add(text,type){

  let d=document.createElement("div");
  d.className="msg "+type;

  d.innerHTML=`
    <div class="msgText">${text}</div>

    <div class="actions">

      <!-- COPY -->
      <svg class="icon" onclick="copyMsg(this)" viewBox="0 0 24 24">
        <path d="M8 8H18V18H8V8Z" stroke="currentColor" stroke-width="2"/>
        <path d="M6 16H6C5 16 4 15 4 14V6C4 5 5 4 6 4H14C15 4 16 5 16 6V6" stroke="currentColor" stroke-width="2"/>
      </svg>

      <!-- DELETE -->
      <svg class="icon" onclick="deleteMsg(this)" viewBox="0 0 24 24">
        <path d="M3 6H21" stroke="currentColor" stroke-width="2"/>
        <path d="M8 6V4H16V6" stroke="currentColor" stroke-width="2"/>
        <path d="M6 6L7 20H17L18 6" stroke="currentColor" stroke-width="2"/>
      </svg>

    </div>
  `;

  chat.appendChild(d);
  scroll();
  save();
}

/* COPY */
function copyMsg(el){
  let msg = el.closest(".msg");
  navigator.clipboard.writeText(msg.innerText);
}

/* DELETE */
function deleteMsg(el){
  if(confirm("Supprimer ce message ?")){
    el.closest(".msg").remove();
    save();
  }
}

/* SEND */
async function send(){

  let i=document.getElementById("input");
  let t=i.value.trim();
  if(!t) return;

  add(t,"user");

  i.value="";

  try{

    let r=await fetch(
      "https://rest-api-orcin-kappa.vercel.app/api/gemma?uid=demo"+
      "&prompt="+encodeURIComponent(t)
    );

    let d=await r.json();

    if(d.status){
      add(d.response,"bot");
    }

  }catch(e){
    add("error","bot");
  }
}

/* MODE */
function toggleMode(){
  document.body.classList.toggle("dark");

  localStorage.setItem(
    "mode",
    document.body.classList.contains("dark") ? "dark":"light"
  );
}

/* BG */
function pickBg(){
  let f=document.getElementById("bgFile");

  f.onchange=()=>{
    let file=f.files[0];
    let reader=new FileReader();

    reader.onload=()=>{
      document.body.style.backgroundImage="url("+reader.result+")";
      localStorage.setItem("bg",reader.result);
    };

    reader.readAsDataURL(file);
  };

  f.click();
}

/* CLEAR */
function clearAll(){
  if(confirm("Tout supprimer ?")){
    chat.innerHTML="";
    localStorage.clear();
  }
}

</script>

</body>
</html>

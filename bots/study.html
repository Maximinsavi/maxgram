<html>
<head>
  <title>Magram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI";
      background:#f5f7fb;
      background-size:cover;
      background-position:center;
    }

    body.dark{background:#0f0f1a;color:white}

    .topbar{
      position:fixed;
      top:0;left:0;right:0;
      height:50px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:600;
      background:rgba(255,255,255,0.85);
      backdrop-filter:blur(10px);
      z-index:9999;
      border-bottom:1px solid #eee;
      color:inherit;
    }

    body.dark .topbar{
      background:rgba(20,20,30,0.85);
      border-color:#222;
    }

    .iconBtn{
      position:absolute;
      top:12px;
      width:22px;
      height:22px;
      cursor:pointer;
      color:inherit;
    }

    .left{left:10px}
    .mid{left:45px}
    .right{right:10px}

    .chat{
      position:absolute;
      top:50px;
      bottom:90px;
      left:0;
      right:0;
      overflow-y:auto;
      padding:10px;
    }

    .msg{
      display:inline-block;
      max-width:78%;
      padding:10px 12px;
      margin:8px 0;
      border-radius:18px;
      font-size:14px;
      word-break:break-word;
      clear:both;
      animation:pop .15s ease;
    }

    @keyframes pop{
      from{opacity:0;transform:translateY(6px)}
      to{opacity:1}
    }

    .user{background:#0a84ff;color:white;float:right}
    .bot{background:white;float:left;box-shadow:0 2px 10px rgba(0,0,0,.06)}

    body.dark .bot{background:#1c1c2e}

    .msgText{white-space:pre-wrap}

    /* MARKDOWN STYLE (GRIS) */
    .md-gray{
      color:#8a8a8a;
      font-weight:500;
    }

    body.dark .md-gray{
      color:#9a9a9a;
    }

    .actions{
      display:flex;
      gap:10px;
      margin-top:6px;
      opacity:.7;
    }

    .icon{
      width:16px;
      height:16px;
      cursor:pointer;
      color:inherit;
    }

    .replyBar{
      position:fixed;
      bottom:60px;
      left:0;right:0;
      background:rgba(255,255,255,0.95);
      backdrop-filter:blur(10px);
      padding:8px 10px;
      display:none;
      align-items:center;
      justify-content:space-between;
      font-size:12px;
      border-top:1px solid #ddd;
    }

    body.dark .replyBar{
      background:rgba(20,20,30,0.9);
      border-color:#222;
      color:white;
    }

    .replyText{
      flex:1;
      opacity:.8;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .closeReply{
      width:18px;
      height:18px;
      cursor:pointer;
    }

    .inputbar{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      display:flex;
      padding:8px;
      gap:6px;
      background:rgba(255,255,255,0.9);
    }

    input{
      flex:1;
      padding:12px;
      border-radius:18px;
      border:1px solid #ddd;
      outline:none;
    }

    button{
      padding:12px;
      border:none;
      border-radius:14px;
      background:#0a84ff;
      color:white;
    }
  </style>
</head>

<body>

<div class="topbar">
  Magram

  <svg class="iconBtn left" onclick="toggleMode()" viewBox="0 0 24 24" fill="none">
    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"
          stroke="currentColor" stroke-width="2"/>
  </svg>

  <svg class="iconBtn mid" onclick="pickBg()" viewBox="0 0 24 24" fill="none">
    <rect x="3" y="3" width="18" height="18" rx="4"
          stroke="currentColor" stroke-width="2"/>
  </svg>

  <svg class="iconBtn right" onclick="clearAll()" viewBox="0 0 24 24" fill="none">
    <path d="M3 6h18" stroke="currentColor" stroke-width="2"/>
    <path d="M8 6V4h8v2" stroke="currentColor" stroke-width="2"/>
    <path d="M7 6l1 14h8l1-14" stroke="currentColor" stroke-width="2"/>
  </svg>
</div>

<div class="chat" id="chat"></div>

<div class="replyBar" id="replyBar">
  <div class="replyText" id="replyText"></div>
  <svg class="closeReply" onclick="clearReply()" viewBox="0 0 24 24">
    <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2"/>
  </svg>
</div>

<div class="inputbar">
  <input id="input" placeholder="Message..." />
  <button onclick="send()">Send</button>
</div>

<script>

var chat=document.getElementById("chat");
var replyTo=null;

/* LOAD */
window.onload=()=>{
  let saved=localStorage.getItem("chat");
  if(saved) chat.innerHTML=saved;

  let bg=localStorage.getItem("bg");
  if(bg) document.body.style.backgroundImage="url("+bg+")";

  let mode=localStorage.getItem("mode");
  if(mode==="dark") document.body.classList.add("dark");
};

/* SAVE */
function save(){
  localStorage.setItem("chat",chat.innerHTML);
}

/* SAFE TEXT (ANTI EXECUTION) */
function escapeHTML(t){
  return t
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

/* MARKDOWN GRAY */
function formatText(t){

  t = escapeHTML(t);

  // ### title -> gray
  t = t.replace(/### (.*)/g,'<div class="md-gray">$1</div>');

  // **bold -> gray (comme demandé)
  t = t.replace(/\*\*(.*?)\*\*/g,'<span class="md-gray">$1</span>');

  return t;
}

/* SCROLL */
function scroll(){
  chat.scrollTop=chat.scrollHeight;
}

/* ADD MSG */
function add(text,type,reply){

  let replyHtml = reply ? `<div class="md-gray" style="border-left:3px solid #0a84ff;padding-left:6px;margin-bottom:5px">${reply}</div>` : "";

  let d=document.createElement("div");
  d.className="msg "+type;

  d.innerHTML=`
    ${replyHtml}
    <div class="msgText">${formatText(text)}</div>

    <div class="actions">

      <!-- COPY (ANCIEN SVG RESTORED) -->
      <svg class="icon" onclick="copyMsg(this)" viewBox="0 0 24 24" fill="none">
        <rect x="9" y="9" width="10" height="10" rx="2"
              stroke="currentColor" stroke-width="2"/>
        <path d="M5 15V5a2 2 0 0 1 2-2h10"
              stroke="currentColor" stroke-width="2"/>
      </svg>

      <!-- REPLY -->
      <svg class="icon" onclick="replyMsg(this)" viewBox="0 0 24 24" fill="none">
        <path d="M9 14l-5-5 5-5" stroke="currentColor" stroke-width="2"/>
        <path d="M4 9h10a6 6 0 0 1 6 6v3" stroke="currentColor" stroke-width="2"/>
      </svg>

      <!-- DELETE -->
      <svg class="icon" onclick="deleteMsg(this)" viewBox="0 0 24 24" fill="none">
        <path d="M4 7h16" stroke="currentColor" stroke-width="2"/>
        <path d="M9 7V5h6v2" stroke="currentColor" stroke-width="2"/>
        <path d="M6 7l1 14h10l1-14" stroke="currentColor" stroke-width="2"/>
      </svg>

    </div>
  `;

  chat.appendChild(d);
  scroll();
  save();
}

/* COPY */
function copyMsg(el){
  navigator.clipboard.writeText(el.closest(".msg").innerText);
}

/* DELETE */
function deleteMsg(el){
  if(confirm("Supprimer ?")){
    el.closest(".msg").remove();
    save();
  }
}

/* REPLY */
function replyMsg(el){
  let msg=el.closest(".msg");
  replyTo=msg.querySelector(".msgText").innerText;

  document.getElementById("replyText").innerText=replyTo;
  document.getElementById("replyBar").style.display="flex";
}

/* CLEAR REPLY */
function clearReply(){
  replyTo=null;
  document.getElementById("replyBar").style.display="none";
}

/* SEND */
async function send(){

  let i=document.getElementById("input");
  let t=i.value.trim();
  if(!t) return;

  add(t,"user",replyTo);

  i.value="";
  clearReply();

  let r=await fetch(
    "https://rest-api-orcin-kappa.vercel.app/api/gemma?uid=demo"+
    "&prompt="+encodeURIComponent(t)
  );

  let d=await r.json();

  if(d.status){
    add(d.response,"bot");
  }

  save();
}

/* MODE */
function toggleMode(){
  document.body.classList.toggle("dark");
  localStorage.setItem("mode",document.body.classList.contains("dark")?"dark":"light");
}

/* BG */
function pickBg(){
  let f=document.createElement("input");
  f.type="file";
  f.accept="image/*";

  f.onchange=()=>{
    let file=f.files[0];
    let r=new FileReader();

    r.onload=()=>{
      document.body.style.backgroundImage="url("+r.result+")";
      localStorage.setItem("bg",r.result);
    };

    r.readAsDataURL(file);
  };

  f.click();
}

/* CLEAR */
function clearAll(){
  chat.innerHTML="";
  localStorage.clear();
}

</script>

</body>
</html>

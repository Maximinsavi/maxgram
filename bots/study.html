<html>
<head>
  <title>Magram Bot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#f5f7fb;
      transition:.3s;
    }

    body.dark{background:#0f0f1a;color:white}

    .topbar{
      position:fixed;top:0;left:0;right:0;
      background:white;
      padding:10px;
      text-align:center;
      font-weight:bold;
      border-bottom:1px solid #ddd;
      z-index:10;
    }

    .mode,.clear{
      position:absolute;top:6px;
      font-size:11px;
      padding:4px 8px;
      border:none;
      border-radius:6px;
    }

    .mode{left:8px}
    .clear{right:8px;background:red;color:white}

    .chat{
      padding:60px 8px 140px;
    }

    .msg{
      display:inline-block;
      max-width:75%;
      padding:9px 11px;
      margin:6px 0;
      border-radius:14px;
      font-size:13px;
      line-height:1.4;
      word-break:break-word;
      animation:pop .2s ease;
      clear:both;
    }

    @keyframes pop{
      from{opacity:0;transform:translateY(6px)}
      to{opacity:1}
    }

    .user{background:#4a6cf7;color:white;float:right}
    .bot{background:white;float:left;box-shadow:0 2px 8px rgba(0,0,0,.06)}

    body.dark .bot{background:#1c1c2e;color:white}

    .actions{font-size:10px;opacity:.6;margin-top:4px}

    .inputbar{
      position:fixed;
      bottom:0;left:0;right:0;
      background:white;
      display:flex;
      padding:6px;
      border-top:1px solid #ddd;
      gap:5px;
    }

    input{
      flex:1;
      padding:10px;
      border-radius:8px;
      border:1px solid #ddd;
      font-size:13px;
      outline:none;
    }

    button{
      padding:10px;
      border:none;
      border-radius:8px;
      background:#4a6cf7;
      color:white;
      font-size:12px;
    }

    pre{
      background:#f3f4f6;
      padding:6px;
      border-radius:6px;
      font-size:12px;
      overflow:auto;
      margin:4px 0;
    }

    .gray{color:#888;font-weight:600}
  </style>
</head>

<body>

<div class="topbar">
  Magram Bot
  <button class="mode" onclick="toggle()">🌙</button>
  <button class="clear" onclick="clearAll()">X</button>
</div>

<div class="chat" id="chat"></div>

<div class="inputbar">
  <input id="input" placeholder="Message..." />
  <button onclick="send()">Send</button>
  <button onclick="document.getElementById('img').click()">📎</button>
  <input type="file" id="img" onchange="upload()" style="display:none">
</div>

<script>
var uid="u_"+Math.random().toString(36).slice(2);
var chat=document.getElementById("chat");

/* LOAD */
window.onload=()=>{
  chat.innerHTML=localStorage.getItem("chat")||"";
};

/* SAVE */
function save(){
  localStorage.setItem("chat",chat.innerHTML);
}

/* FORMAT SAFE */
function format(t){
  t=t.replace(/&/g,"&amp;")
     .replace(/</g,"&lt;")
     .replace(/>/g,"&gt;");

  t=t.replace(/### (.*)/g,'<span class="gray">$1</span>');
  t=t.replace(/\*\*(.*?)\*\*/g,'<span class="gray">$1</span>');

  t=t.replace(/```([\s\S]*?)```/g,(a,b)=>{
    return "<pre>"+b+"</pre>";
  });

  return t;
}

/* ADD */
function add(t,type){
  var d=document.createElement("div");
  d.className="msg "+type;

  d.innerHTML=format(t)+`
    <div class="actions">
      <span onclick="copy(this)">copy</span>
      <span onclick="del(this)">del</span>
    </div>
  `;

  chat.appendChild(d);
  scroll();
  save();
}

/* COPY */
function copy(e){
  navigator.clipboard.writeText(e.parentElement.parentElement.innerText);
}

/* DELETE */
function del(e){
  if(!confirm("delete?"))return;
  e.parentElement.parentElement.remove();
  save();
}

/* SCROLL */
function scroll(){
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

/* SEND (FIXED API) */
async function send(){
  let i=document.getElementById("input");
  let t=i.value;
  if(!t.trim())return;

  add(t,"user");
  i.value="";

  try{
    let r=await fetch(
      "https://rest-api-orcin-kappa.vercel.app/api/gemma?uid="+uid+
      "&prompt="+encodeURIComponent(t)
    );

    let d=await r.json();

    if(d.status){
      add("🤖 "+d.response,"bot");
    }else{
      add("error","bot");
    }

  }catch(e){
    add("error","bot");
  }
}

/* IMAGE FIX */
function upload(){
  let f=document.getElementById("img").files[0];
  let fr=new FileReader();

  fr.onload=()=>{
    let d=document.createElement("div");
    d.className="msg user";
    d.innerHTML=`<img src="${fr.result}" style="max-width:100%;border-radius:10px;">`;

    chat.appendChild(d);
    scroll();
    save();
  };

  fr.readAsDataURL(f);
}

/* MODE */
function toggle(){
  document.body.classList.toggle("dark");
}

/* CLEAR */
function clearAll(){
  if(confirm("clear?")){
    chat.innerHTML="";
    localStorage.clear();
  }
}
</script>

</body>
</html>

<html>
<head>
  <title>Magram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI";
      background:#f5f7fb;
      background-size:cover;
      background-position:center;
      overflow:hidden;
    }

    .topbar{
      position:fixed;
      top:0;left:0;right:0;
      height:50px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:600;
      background:rgba(255,255,255,0.85);
      backdrop-filter:blur(10px);
      border-bottom:1px solid #eee;
      z-index:1000;
    }

    .btn{
      position:absolute;
      top:10px;
      padding:6px 10px;
      border:none;
      border-radius:8px;
      font-size:11px;
    }

    .mode{left:8px}
    .bg{right:70px;background:#0a84ff;color:white}
    .clear{right:8px;background:#ff3b30;color:white}

    .chat{
      position:absolute;
      top:50px;
      bottom:130px;
      left:0;
      right:0;
      overflow-y:auto;
      padding:10px;
    }

    .msg{
      display:inline-block;
      max-width:78%;
      padding:10px 12px;
      margin:6px 0;
      border-radius:18px;
      font-size:14px;
      word-break:break-word;
      clear:both;
      transition:transform .2s ease;
      position:relative;
    }

    .user{background:#0a84ff;color:white;float:right}
    .bot{background:white;float:left;box-shadow:0 2px 10px rgba(0,0,0,.06)}

    /* ACTION MENU */
    .actions{
      font-size:10px;
      opacity:.6;
      margin-top:5px;
      display:flex;
      gap:8px;
    }

    .replyBar{
      position:fixed;
      bottom:60px;
      left:0;right:0;
      background:rgba(255,255,255,0.95);
      padding:8px 10px;
      font-size:12px;
      display:none;
      border-top:1px solid #ddd;
      z-index:999;
    }

    .inputbar{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      display:flex;
      padding:8px;
      gap:6px;
      background:rgba(255,255,255,0.9);
      backdrop-filter:blur(10px);
    }

    input{
      flex:1;
      padding:12px;
      border-radius:18px;
      border:1px solid #ddd;
    }

    button{
      padding:12px;
      border:none;
      border-radius:14px;
      background:#0a84ff;
      color:white;
    }

  </style>
</head>

<body>

<div class="topbar">
  Magram
  <button class="btn mode" onclick="toggle()">🌙</button>
  <button class="btn bg" onclick="pickBg()">🖼</button>
  <button class="btn clear" onclick="clearAll()">X</button>
</div>

<div class="chat" id="chat"></div>

<div class="replyBar" id="replyBar"></div>

<div class="inputbar">
  <input id="input" placeholder="Message..." />
  <button onclick="send()">Send</button>
</div>

<script>

var chat=document.getElementById("chat");
var replyTo=null;

/* SCROLL */
function scroll(){
  chat.scrollTop=chat.scrollHeight;
}

/* MESSAGE */
function add(text,type){

  let d=document.createElement("div");
  d.className="msg "+type;

  d.innerHTML=text+`
    <div class="actions">
      <span onclick="copyMsg(this)">copy</span>
      <span onclick="deleteMsg(this)">del</span>
      <span onclick="replyMsg(this)">reply</span>
    </div>
  `;

  enableSwipe(d);

  chat.appendChild(d);
  scroll();
}

/* COPY */
function copyMsg(el){
  navigator.clipboard.writeText(el.parentElement.parentElement.innerText);
}

/* DELETE WITH CONFIRM */
function deleteMsg(el){

  if(confirm("⚠ Voulez-vous vraiment supprimer ce message ?")){
    el.parentElement.parentElement.remove();
  }
}

/* REPLY */
function replyMsg(el){
  replyTo=el.parentElement.parentElement.innerText;
  showReply(replyTo);
}

/* REPLY BAR */
function showReply(text){
  let bar=document.getElementById("replyBar");
  bar.style.display="block";
  bar.innerText="Replying to: "+text;
}

/* SWIPE WHATSAPP */
function enableSwipe(el){

  let startX=0;
  let moveX=0;

  el.addEventListener("touchstart",e=>{
    startX=e.touches[0].clientX;
  });

  el.addEventListener("touchmove",e=>{
    moveX=e.touches[0].clientX-startX;
    if(moveX<0){
      el.style.transform=`translateX(${moveX}px)`;
    }
  });

  el.addEventListener("touchend",()=>{
    if(moveX<-90){
      replyMsg({parentElement:{parentElement:el}});
    }
    el.style.transform="translateX(0)";
    moveX=0;
  });
}

/* SEND */
async function send(){

  let i=document.getElementById("input");
  let t=i.value.trim();
  if(!t) return;

  add(t,"user");

  i.value="";

  try{

    let r=await fetch(
      "https://rest-api-orcin-kappa.vercel.app/api/gemma?uid=demo"+
      "&prompt="+encodeURIComponent(t)
    );

    let d=await r.json();

    if(d.status){
      add("🤖 "+d.response,"bot");
    }

  }catch(e){
    add("error","bot");
  }
}

/* BG */
function pickBg(){
  let url=prompt("Image URL background:");
  if(url){
    document.body.style.backgroundImage="url("+url+")";
  }
}

/* MODE */
function toggle(){
  document.body.classList.toggle("dark");
}

/* CLEAR */
function clearAll(){
  chat.innerHTML="";
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connexion</title>

<script src="https://npmcdn.com/parse/dist/parse.min.js"></script>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f6f7fb;
}

/* HEADER */
header {
    height: 60px;
    background: white;
    border-bottom: 1px solid #eaeaea;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-weight: 600;
}

/* WRAPPER */
.wrapper {
    max-width: 520px;
    padding: 40px 20px;
}

/* TITLE */
h2 {
    margin: 0;
    font-size: 24px;
}

.subtitle {
    color: #666;
    font-size: 14px;
    margin-bottom: 25px;
}

/* FORM */
form {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

input {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ddd;
    outline: none;
    background: white;
}

input:focus {
    border-color: #2f6fff;
}

/* BUTTON */
button {
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #2f6fff;
    color: white;
    cursor: pointer;
    font-weight: 500;
}

button:hover {
    background: #2457d6;
}

/* LINK */
.link {
    margin-top: 15px;
    font-size: 13px;
    color: #555;
}

.link a {
    color: #2f6fff;
    text-decoration: none;
}

/* TOAST */
.toast {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 12px 16px;
    border-radius: 10px;
    color: white;
    font-size: 14px;
    opacity: 0;
    transform: translateY(-10px);
    transition: 0.3s;
    z-index: 999;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.toast.show {
    opacity: 1;
    transform: translateY(0);
}

.toast.success {
    background: #22c55e;
}

.toast.error {
    background: #ef4444;
}
</style>

</head>

<body>

<header>
    MaxGram - Connexion
</header>

<div class="wrapper">

    <h2>Se connecter</h2>
    <div class="subtitle">Accède à ton compte MaxGram</div>

    <form onsubmit="login(event)">

        <input id="email" type="email" placeholder="Email" required>

        <input id="password" type="password" placeholder="Mot de passe" required>

        <button type="submit">Connexion</button>

    </form>

    <div class="link">
        Pas de compte ? <a href="/register.html">Créer un compte</a>
    </div>

</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script>

// INIT PARSE
Parse.initialize("BHxYtdxdSPMSH5vXHVdKCVTBrxMBlbPLhz2p4CRc", "88Fp770fFyWoBEXCljw9QhlaY6EPYcx9kR1sVpZV");
Parse.serverURL = "https://parseapi.back4app.com";

/* TOAST */
function showToast(message, type) {
    const toast = document.getElementById("toast");

    toast.className = "toast show " + type;
    toast.innerText = message;

    setTimeout(() => {
        toast.className = "toast";
    }, 3000);
}

/* LOGIN */
function login(e) {
    e.preventDefault();

    var email = document.getElementById("email").value;
    var password = document.getElementById("password").value;

    Parse.User.logIn(email, password)
    .then(function(user) {

        showToast("Connexion réussie", "success");

        setTimeout(() => {
            window.location.href = "/home.html";
        }, 1200);

    })
    .catch(function(error) {

        showToast(error.message, "error");

    });
}

</script>

</body>
</html>

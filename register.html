<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Créer un compte</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f6f7fb;
}

header {
    height: 60px;
    background: white;
    border-bottom: 1px solid #eaeaea;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-weight: 600;
}

.wrapper {
    max-width: 520px;
    padding: 40px 20px;
}

h2 {
    margin: 0;
    font-size: 24px;
}

.subtitle {
    color: #666;
    font-size: 14px;
    margin-bottom: 25px;
}

form {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

input {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ddd;
    outline: none;
}

input:focus {
    border-color: #2f6fff;
}

button {
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #2f6fff;
    color: white;
    cursor: pointer;
    font-weight: 500;
}

button:hover {
    background: #2457d6;
}

.link {
    margin-top: 15px;
    font-size: 13px;
    color: #555;
    text-align: center;
}

.link a {
    color: #2f6fff;
    text-decoration: none;
}

/* TOAST */
.toast {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 12px 16px;
    border-radius: 10px;
    color: white;
    font-size: 14px;
    opacity: 0;
    transform: translateY(-10px);
    transition: 0.3s;
    z-index: 999;
}

.toast.show {
    opacity: 1;
    transform: translateY(0);
}

.toast.success {
    background: #22c55e;
}

.toast.error {
    background: #ef4444;
}

</style>

</head>

<body>

<header>
    MaxGram - Inscription
</header>

<div class="wrapper">

    <h2>Créer un compte</h2>
    <div class="subtitle">Rejoins MaxGram en quelques secondes</div>

    <form onsubmit="register(event)">

        <input id="username" placeholder="Nom d'utilisateur" required>
        <input id="email" type="email" placeholder="Email" required>
        <input id="password" type="password" placeholder="Mot de passe" required>

        <button type="submit">Créer un compte</button>

    </form>

    <div class="link">
        Déjà un compte ? <a href="/login.html">Se connecter</a>
    </div>

</div>

<div id="toast" class="toast"></div>

<script>

/* SUPABASE INIT */
var supabaseUrl = "https://zcckclyeqawcaclzmabj.supabase.co";
var supabaseKey = "sb_publishable_Vj1M_Jkv68n4EXuMmzjNow_RI05o_jh";

var supabase = supabase.createClient(supabaseUrl, supabaseKey);

/* CHECK USER */
async function checkUser(){
    var { data } = await supabase.auth.getUser();

    if(data && data.user){
        window.location.href = "/home.html";
    }
}

checkUser();

/* TOAST */
function showToast(message, type) {

    var toast = document.getElementById("toast");

    toast.className = "toast show " + type;
    toast.innerText = message;

    setTimeout(function () {
        toast.className = "toast";
    }, 3000);

}

/* REGISTER */
async function register(e) {

    e.preventDefault();

    var username = document.getElementById("username").value;
    var email = document.getElementById("email").value;
    var password = document.getElementById("password").value;

    var { data, error } = await supabase.auth.signUp({
        email: email,
        password: password
    });

    if (error) {
        showToast(error.message, "error");
        return;
    }

    showToast("Compte créé avec succès", "success");

    setTimeout(function () {
        window.location.href = "/home.html";
    }, 1200);

}

</script>

</body>
</html>

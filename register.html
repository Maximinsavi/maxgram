<script>
  var google_client_id= 'https://422258767550-fqkv64t1ceo0o1f4phu7g47crb3vl5g2.apps.googleusercontent.com';
  var domain = 'https://maxgram-chi.vercel.app';
  
  $(window).resize(function() {
    if ($("#password-popup").is(":visible")) {
      $("#password-popup").css({
	      top: $("#password").offset().top - $("#password-popup").outerHeight() - 4,
	      left: $("#password").offset().left - 20.5
      });
    }
  });
  
  $("#password").on("focus", function() {
  	$("#password-popup").css({
      top: $("#password").offset().top - $("#password-popup").outerHeight() - 4,
      left: $("#password").offset().left - 20.5
    }).show();
  });
  
  $("#password").on("focusout", function() {
  	$("#password-popup").hide();
  	validatePassword();
  });
  
  $("#password").on("input", function() {
	validatePassword();
  });
  
  $("#email").on("focusout", function() {
  	validateEmail();
  });
  
  function validateEmail() {
  	const email = $("#email").val();
  	
  	if (email.length == 0) {
		addError($("#email"), "Email required");
		return;
	}

	if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
		addError($("#email"), "Invalid format. Please enter a valid email address");
		return;
	}
	
	hideError($("#email"));
  }
  
  function validatePassword() {
  	const password = $("#password").val();
  	const email = $("#email").val();
  	
  	var isLower = checkAndSetCondition(password, ".*[a-z].*", $("#lowercase-condition"));
	var isUpper = checkAndSetCondition(password, ".*[A-Z].*", $("#uppercase-condition"));
	var isNumber = checkAndSetCondition(password, ".*[0-9].*", $("#number-condition"));
	var isLength = checkAndSetCondition(password, ".{8,}", $("#minimum-condition"));
	
	if (password.length == 0) {
		addError($("#password"), "Password required");
		return;
	}
	if (!isLower || !isUpper || !isNumber || !isLength) {
		addError($("#password"), "Passwords must meet all the requirements");
		return;
	}
	if (email == password) {
		addError($("#password"), "Password can't be the same as the email");
		return;
	}
	
	hideError($("#password"));
  }
  
  function checkAndSetCondition(text, conditionExpression, element) {
  	$(element).removeClass("NONE").removeClass("PASS").removeClass("FAIL");
  	if (new RegExp(conditionExpression).test(text)) {
  		$(element).addClass("PASS");
  		return true;
  	}
  	else {
  		$(element).addClass("FAIL");
  		return false;
  	}
  };
  
  function addError(element, text) {
  	$(element).addClass("errorInput");
  	if ($(element).parent().find(".error").length == 0)
		$(element).parent().append($("<div class='error'>" + text + "</div>"));
  }
  
  function hideError(element) {
	$(element).removeClass("errorInput");
  	$(element).parent().find(".error").remove();
  }

  function readCookie(name) {
    var nameEQ = name + "=";
    var ca = document.cookie.split(';');
    for (var i = 0; i < ca.length; i++) {
      var c = ca[i];
      while (c.charAt(0)==' ') c = c.substring(1, c.length);
      if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
    }
    return null;
  };

  function getAnalyticsData() {
    var data = {
        url: $("#usernote-login input[name='url']").val(),
        username: $("#usernote-login #email").val(),
        password: $("#usernote-login #password").val(),
        rememberMe: $("#rememberMe").val(),
        "struts.token.name": "token",
        token: $("#usernote-login input[name='token']").val(),
        fromPurchase: true,
        period: $("input[name=period]:checked").val(),
        edition: $("input[name=edition]").val(),
        operation: $("input[name=operation]").val(),
        reToken: $("input[name=reToken]").val()
    };

    var existingCookie = readCookie("jim");
    
    var source, medium, campaign, term, content, gclid;
    if(existingCookie){
      if (typeof existingCookie === 'string' || existingCookie instanceof String){
        if(existingCookie.slice(-1)==="\""){
            existingCookie = existingCookie.slice(0, -1);
        }
        source = readValueFromPairList(existingCookie, "source", "|");
        medium = readValueFromPairList(existingCookie, "medium", "|");
        campaign = readValueFromPairList(existingCookie, "campaign", "|");
        term = readValueFromPairList(existingCookie, "term", "|").replace(/\+/g," ");
        content = readValueFromPairList(existingCookie, "content", "|");
        gclid = readValueFromPairList(existingCookie, "gclid", "|");
      }
    }

    var extraData = {};
    if(existingCookie) {
        extraData = {
            campaignSource:     source,
            campaignMedium:     medium,
            campaignKeyword:    term,
            campaignContent:    content,
            campaignId:         campaign,
            adwordsID:          gclid
        };
    }
    return $.extend(data, extraData);
  }
</script>

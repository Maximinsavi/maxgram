<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Créer un compte</title>

<script src="https://npmcdn.com/parse/dist/parse.min.js"></script>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f6f7fb;
}

/* HEADER SIMPLE */
header {
    height: 60px;
    background: white;
    border-bottom: 1px solid #eaeaea;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-weight: 600;
}

/* PAGE WRAPPER (PAS CENTRÉ) */
.wrapper {
    padding: 40px 20px;
    max-width: 500px;
}

/* TITLE */
h2 {
    margin: 0 0 5px 0;
    font-size: 24px;
}

.subtitle {
    color: #666;
    font-size: 14px;
    margin-bottom: 25px;
}

/* FORM */
form {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* INPUT */
input {
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    outline: none;
    background: white;
}

input:focus {
    border-color: #2f6fff;
}

/* BUTTON */
button {
    padding: 12px;
    background: #2f6fff;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
}

button:hover {
    background: #2457d6;
}

/* LINK */
.link {
    margin-top: 15px;
    font-size: 13px;
    color: #555;
}

.link a {
    color: #2f6fff;
    text-decoration: none;
}
</style>

</head>

<body>

<header>
    MaxGram - Inscription
</header>

<div class="wrapper">

    <h2>Créer un compte</h2>
    <div class="subtitle">Rejoins MaxGram en quelques secondes</div>

    <form onsubmit="register(event)">

        <input id="username" type="text" placeholder="Nom d'utilisateur" required>

        <input id="email" type="email" placeholder="Email" required>

        <input id="password" type="password" placeholder="Mot de passe" required>

        <button type="submit">Créer mon compte</button>

    </form>

    <div class="link">
        Déjà un compte ? <a href="/login.html">Se connecter</a>
    </div>

</div>

<script>
// INIT PARSE
Parse.initialize("BHxYtdxdSPMSH5vXHVdKCVTBrxMBlbPLhz2p4CRc", "Fzgz1pUuy6WsxwKze4Pi6K3trFlL8QcSTOSFk4VN");
Parse.serverURL = "https://parseapi.back4app.com";

// REGISTER
function register(e) {
    e.preventDefault();

    var username = document.getElementById("username").value;
    var email = document.getElementById("email").value;
    var password = document.getElementById("password").value;

    var user = new Parse.User();

    user.set("username", username);
    user.set("email", email);
    user.set("password", password);

    user.signUp().then(function() {

        window.location.href = "/home.html";

    }).catch(function(error) {
        alert(error.message);
    });
}
</script>

</body>
</html>

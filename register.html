<head>

<script src="https://accounts.google.com/gsi/client" async defer></script>

body {

}

}

<body>

<div class="box">
    <h2>MaxGram</h2>

    <div id="g_id_onload"

         data-callback="handleGoogleLogin"
         data-auto_prompt="false">

         data-theme="outline"
         data-text="sign_in_with"
         data-shape="rectangular">

        Connexion sécurisée avec Google

</div>

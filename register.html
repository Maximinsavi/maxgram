<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body {
margin:0;
font-family:Arial;
background:#f6f7fb;
}

.wrapper {
max-width:450px;
margin:auto;
padding:40px 20px;
}

input, button {
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ddd;
}

button {
background:#2f6fff;
color:white;
border:none;
cursor:pointer;
}

button:hover {
background:#2457d6;
}

.link {
margin-top:15px;
font-size:13px;
text-align:center;
}

.toast {
position:fixed;
top:20px;
right:20px;
background:#333;
color:white;
padding:10px 15px;
border-radius:10px;
opacity:0;
transition:0.3s;
}

.toast.show {
opacity:1;
}

</style>

</head>

<body>

<div class="wrapper">

<h2>Créer un compte</h2>

<form onsubmit="register(event)">

<input id="email" type="email" placeholder="Email" required>
<input id="password" type="password" placeholder="Mot de passe" required>

<button>Créer un compte</button>

</form>

<div class="link">
Déjà un compte ? <a href="/login.html">Connexion</a>
</div>

</div>

<div id="toast" class="toast"></div>

<script>

var supabaseUrl = "https://zcckclyeqawcaclzmabj.supabase.co";
var supabaseKey = "sb_publishable_Vj1M_Jkv68n4EXuMmzjNow_RI05o_jh";

var supabase = supabase.createClient(supabaseUrl, supabaseKey);

function showToast(msg){
var t = document.getElementById("toast");
t.innerText = msg;
t.className = "toast show";
setTimeout(()=>t.className="toast",2000);
}

async function register(e){
e.preventDefault();

var email = document.getElementById("email").value;
var password = document.getElementById("password").value;

var { data, error } = await supabase.auth.signUp({
email: email,
password: password,
options: {
emailRedirectTo: window.location.origin + "/home.html"
}
});

if(error){
showToast(error.message);
return;
}

showToast("Vérifie ton email 📩");

setTimeout(()=>{
window.location.href="/check-email.html";
},1200);

}

</script>

</body>
</html>
